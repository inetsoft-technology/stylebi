<div>
  @switch (frameType) {
    @case ('StaticColorModel') {
      <div>
        @if (!isMixed) {
          <div class="visual-cell hover-bg-neutral color-cell__surface" [class.bd-gray]="!colors[0]"
            [style.background-color]="colors[0]">
          </div>
        }
      </div>
    }
    @case ('SaturationColorModel') {
      <div class="svg-container">
        <svg [attr.width]="cellWidth" [attr.height]="cellHeight">
          <defs>
            <linearGradient y2="1" x2="1" y1="1" x1="0" [id]="getStyleId('hsl_svg')">
              <stop [attr.stop-color]="colors[0]" offset="0"/>
              <stop [attr.stop-color]="colors[1]" offset="1"/>
            </linearGradient>
          </defs>
          <rect y="0" x="0" [attr.width]="cellWidth" [attr.height]="cellHeight"
            [ngStyle]="{'fill': getSvgUrl('hsl_svg')}"/>
        </svg>
      </div>
    }
    @case ('GradientColorModel') {
      <div class="svg-container">
        <svg [attr.width]="cellWidth" [attr.height]="cellHeight">
          <defs>
            <linearGradient y2="1" x2="1" y1="1" x1="0" [id]="getStyleId('gradient_svg')">
              <stop [attr.stop-color]="colors[0]" offset="0"/>
              <stop [attr.stop-color]="colors[1]" offset="1"/>
            </linearGradient>
          </defs>
          <rect y="0" x="0" [attr.width]="cellWidth" [attr.height]="cellHeight"
            [ngStyle]="{'fill': getSvgUrl('gradient_svg')}"/>
        </svg>
      </div>
    }
    @case ('BrightnessColorModel') {
      <div class="svg-container">
        <svg [attr.width]="cellWidth" [attr.height]="cellHeight">
          <defs>
            <linearGradient y2="1" x2="1" y1="1" x1="0" [id]="getStyleId('brightness_svg')">
              <stop [attr.stop-color]="colors[0]" offset="0"/>
              <stop [attr.stop-color]="colors[1]" offset="0.5"/>
              <stop [attr.stop-color]="colors[2]" offset="1"/>
            </linearGradient>
          </defs>
          <rect y="0" x="0" [attr.width]="cellWidth" [attr.height]="cellHeight"
            [ngStyle]="{'fill': getSvgUrl('brightness_svg')}"/>
        </svg>
      </div>
    }
    @default {
      <div>
        @if (frameType === 'CategoricalColorModel') {
          <!-- The first four colours of the modern palette, in legend order, instead of the
               pastel raster this used to be, so the tile matches the shell around it. -->
          <svg class="color-cell__categorical" width="20" height="20" viewBox="0 0 20 20"
               aria-hidden="true">
            <rect class="color-cell__categorical-1" x="0" y="0" width="9.25" height="9.25" rx="1.5"/>
            <rect class="color-cell__categorical-2" x="10.75" y="0" width="9.25" height="9.25" rx="1.5"/>
            <rect class="color-cell__categorical-3" x="0" y="10.75" width="9.25" height="9.25" rx="1.5"/>
            <rect class="color-cell__categorical-4" x="10.75" y="10.75" width="9.25" height="9.25" rx="1.5"/>
          </svg>
        }
        @else if (imageSrc) {
          <img [src]="imageSrc">
        }
      </div>
    }
  }
</div>
