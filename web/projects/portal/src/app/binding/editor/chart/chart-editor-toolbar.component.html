@if (bindingModel) {
  <div class="chart-toolbar-group" role="group" aria-label="_#(Chart type and layout)">
    <chart-type-button [toolbar]="true" [chartType]="bindingModel.chartType"
      [multiStyles]="bindingModel.multiStyles" [stackMeasures]="bindingModel.stackMeasures">
    </chart-type-button>
    <button type="button" class="chart-toolbar-btn"
      [attr.title]="isSeparateDisabled() ? '_#(Separate graphs are not available for this chart type)' : getSeparatedTitle()"
      aria-label="_#(Separate graphs)"
      [attr.aria-pressed]="bindingModel.separated ? 'true' : 'false'"
      [attr.aria-disabled]="isSeparateDisabled() ? 'true' : null"
      (click)="changeSeparateStatus()">
      <span [ngClass]="getSeparatedIcon()" aria-hidden="true"></span>
    </button>
    @if (isSwapVisible()) {
      <button type="button" class="chart-toolbar-btn" title="_#(Swap XY)"
        aria-label="_#(Swap XY)"
        [attr.aria-disabled]="isSwapEnabled() ? null : 'true'"
        (click)="swapXYBinding()">
        <span class="rotate-icon" aria-hidden="true"></span>
      </button>
    }
  </div>
}
