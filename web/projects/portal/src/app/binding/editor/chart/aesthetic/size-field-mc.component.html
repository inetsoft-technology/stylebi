@let hintText = getHint();
<div dropHighlight (drop)="drop($event)" [disabled]="!_isEnabled"
  outOfZone (onDragover)="dragOver($event)">
  <div class="field-pane field-pane--surface" [class.disabled-grayout]="!_isEnabled" >
    <div class="field-container" data-test="size-field-container">
      <div [fixedDropdown]="dropdownMenu" [autoClose]="false" [zIndex]="10000"
        [disabled]="!isFrameEditEnabled()"
        class="field-icon hover-bg-neutral" (openChange)="openChanged($event)">
        <!--Always the same three concentric circles, so the tile never changes identity. The rings
            carry the state: a static size dark on the ring its value falls in, a field-driven or
            mixed size dark on all three. The tile used to swap to a painted frame preview as soon
            as another shelf was in use.-->
        @let rings = sizeRings;
        <div class="visual-edit-icon no-caret" [attr.title]="sizeTitle">
          <svg class="size-glyph" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.5"
               [class.icon-disabled]="!isFrameEditEnabled()">
            <circle class="size-glyph__ring" [class.size-glyph__ring--off]="!rings[2]"
                    cx="10" cy="10" r="8.5"/>
            <circle class="size-glyph__ring" [class.size-glyph__ring--off]="!rings[1]"
                    cx="10" cy="10" r="5.5"/>
            <circle class="size-glyph__ring" [class.size-glyph__ring--off]="!rings[0]"
                    cx="10" cy="10" r="2.5"/>
          </svg>
        </div>
      </div>

      <!--aesthetic field mc-->
      <div class="visual-field">
        <chart-aesthetic-mc class="w-100" [field]="field"
          [isEnabled]="_isEnabled" [isEditEnabled]="_isEditEnabled"
          [fieldType]="getFieldType()" [isMixed]="_isMixed"
          [dragComplete]="dragFieldMCComplete" [currentAggr]="aggr"
          [grayedOutValues]="grayedOutValues" [hint]="hintText"
          [targetField]="targetField"
          (onChangeAesthetic)="doSubmit(false)"
          (onConvert)="convert($event)" data-test="size-field-aesthetic">
        </chart-aesthetic-mc>
      </div>
    </div>
  </div>
</div>
<ng-template #dropdownMenu>
  @if (editPaneId) {
    <div class="dropdown-pane">
      @if (frames) {
        <div>
          @switch (editPaneId) {
            @case ('StaticSize') {
              <div>
                <static-size-pane [frameModel]="frames[0]" [aggr]="aggr"
                  [autoOnly]="isTreemapLayout"
                  (sizeChanged)="submitIfChanged()"
                  (apply)="openChanged(false)">
                </static-size-pane>
              </div>
            }
            @case ('BindingSize') {
              <div>
                <binding-size-pane [frameModel]="frames[0]" (apply)="openChanged($event)"
                [singleValue]="isInterval()"></binding-size-pane>
              </div>
            }
            @case ('CombinedSize') {
              <div>
                <combined-size-pane [chartRefs]="chartRefs" (apply)="openChanged($event)"
                (sizeChanged)="submitIfChanged()"></combined-size-pane>
              </div>
            }
          }
        </div>
      }
    </div>
  }
</ng-template>
