<div [attr.title]="tooltip">
  @if (isStaticShape && !isMixed) {
    <div>
      <shape-item [shapeStr]="shapeModel.shape" [isBiggerImage]="true"></shape-item>
    </div>
  }

  @if (isStaticShape && isMixed) {
    <div>
      <ng-container *ngTemplateOutlet="pointsGlyph"></ng-container>
    </div>
  }

  @if (isLinearShape) {
    <div>
      <ng-container *ngTemplateOutlet="pointsGlyph"></ng-container>
    </div>
  }

  @if (isStaticTexture && !isMixed) {
    <div>
      <texture-item [texture]="textureModel.texture" [isLongerImage]="true">
      </texture-item>
    </div>
  }

  @if (isStaticTexture && isMixed) {
    <div>
      <ng-container *ngTemplateOutlet="patternsGlyph"></ng-container>
    </div>
  }

  @if (isLinearTexture) {
    <div>
      <ng-container *ngTemplateOutlet="patternsGlyph"></ng-container>
    </div>
  }

  @if (isStaticLine && !isMixed) {
    <div>
      <line-item [line]="lineModel.line"></line-item>
    </div>
  }

  @if (isStaticLine && isMixed) {
    <div>
      <ng-container *ngTemplateOutlet="linesGlyph"></ng-container>
    </div>
  }

  @if (isLinearLine) {
    <div>
      <ng-container *ngTemplateOutlet="linesGlyph"></ng-container>
    </div>
  }
</div>

<!--
  The three "mixed or linear" glyphs, drawn at 20px on a 20-unit grid with the art filling the box,
  so it is centred in its tile. The tile's own border is the only frame. They replace the icon-font
  glyphs of the same names, which are inline text and so are placed by font metrics and line boxes.
  Block-level svgs have neither. The shape glyph is a triangle, circle and square: three different
  shapes read as "varies with the data".
-->
<ng-template #pointsGlyph>
  <svg class="shape-cell__glyph" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
       fill="currentColor">
    <polygon points="10,0.7 16.2,10 3.8,10"/>
    <circle cx="5.8" cy="15.3" r="4.5"/>
    <rect x="11" y="11.3" width="8" height="8" rx="0.5"/>
  </svg>
</ng-template>
<ng-template #patternsGlyph>
  <svg class="shape-cell__glyph" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
       fill="currentColor">
    <rect x="1" y="1" width="4.8" height="4.8" rx="0.6"/>
    <rect x="7.6" y="1" width="4.8" height="4.8" rx="0.6"/>
    <rect x="14.2" y="1" width="4.8" height="4.8" rx="0.6"/>
    <rect x="1" y="7.6" width="4.8" height="4.8" rx="0.6"/>
    <rect x="7.6" y="7.6" width="4.8" height="4.8" rx="0.6"/>
    <rect x="14.2" y="7.6" width="4.8" height="4.8" rx="0.6"/>
    <rect x="1" y="14.2" width="4.8" height="4.8" rx="0.6"/>
    <rect x="7.6" y="14.2" width="4.8" height="4.8" rx="0.6"/>
    <rect x="14.2" y="14.2" width="4.8" height="4.8" rx="0.6"/>
  </svg>
</ng-template>
<ng-template #linesGlyph>
  <svg class="shape-cell__glyph" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
       fill="currentColor">
    <rect x="1.0" y="1.5" width="18.0" height="2"/>
    <rect x="1.0" y="5.5" width="8.2" height="2"/>
    <rect x="10.8" y="5.5" width="8.2" height="2"/>
    <rect x="1.0" y="9.5" width="4.933" height="2"/>
    <rect x="7.533" y="9.5" width="4.933" height="2"/>
    <rect x="14.067" y="9.5" width="4.933" height="2"/>
    <rect x="1.0" y="13.5" width="3.3" height="2"/>
    <rect x="5.9" y="13.5" width="3.3" height="2"/>
    <rect x="10.8" y="13.5" width="3.3" height="2"/>
    <rect x="15.7" y="13.5" width="3.3" height="2"/>
    <rect x="1.0" y="17.5" width="2.32" height="2"/>
    <rect x="4.92" y="17.5" width="2.32" height="2"/>
    <rect x="8.84" y="17.5" width="2.32" height="2"/>
    <rect x="12.76" y="17.5" width="2.32" height="2"/>
    <rect x="16.68" y="17.5" width="2.32" height="2"/>
  </svg>
</ng-template>
