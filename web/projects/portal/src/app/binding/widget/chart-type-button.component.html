<button type="button" [fixedDropdown]="dropdownMenu" [autoClose]="false"
   [class.d-flex]="!toolbar" [class.btn]="!toolbar" [class.btn-primary]="!toolbar"
   [class.btn-sm]="!toolbar" [class.chart-toolbar-btn]="toolbar"
   aria-haspopup="dialog" [attr.aria-expanded]="menuOpen ? 'true' : 'false'"
   aria-label="_#(Select Chart Style)"
   (openChange)="toggled($event)" title="_#(Select Chart Style)">
   <span [ngClass]="getIconPath()" aria-hidden="true"></span>
   @if (toolbar) {
     <span class="chevron-down-icon icon-size-small0" aria-hidden="true"></span>
   }
</button>
<ng-template #dropdownMenu>
  <div class="dropdown-pane" blockMouse>
    <chart-style-pane [chartType]="chartType" [multiStyles]="multiStyles"
                      [customChartTypes]="customChartTypes" [refName]="refName"
                      [stackMeasures]="isStackMeasures"
                      [stackMeasuresVisible]="isStackMeasuresVisible()"
                      [stackMeasuresEnabled]="isStackMeasuresEnabled()"
                      [chartStyles]="chartStyles"
                      (changeChartType)="updateChartType($event)"
                      (changeMultiStyles)="updateMultiStyles($event)"
                      (changeStackMeasures)="updateStackMeasures($event)"
                      (apply)="toggled($event)">
    </chart-style-pane>
  </div>
</ng-template>
