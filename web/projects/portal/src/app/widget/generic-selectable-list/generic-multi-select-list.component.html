<div class="selectable-list generic-multi-select-list">
  @for (_label of labels; track $index; let _i = $index) {
    <div class="unhighlightable generic-multi-select-list__item"
      (click)="toggle(values[_i])" [class.selected]="isSelected(values[_i])"
      [class.fade]="disabled">
      <input type="checkbox" class="form-check-input generic-multi-select-list__checkbox"
        tabindex="-1" [checked]="isSelected(values[_i])" [disabled]="disabled">
      <span class="generic-multi-select-list__label">{{_label}}</span>
    </div>
  }
  @if (dataTruncated) {
    <div class="unhighlightable generic-multi-select-list__item generic-multi-select-list__item--disabled">
      (_#(data.truncated))
    </div>
  }
</div>
