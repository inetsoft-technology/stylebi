     <sc-for list=\"{{ scaleTokens }}\" as=\"t\" hint-placeholder-count=\"12\">\n          <div style=\"display:grid; grid-template-columns:1.5fr 1fr 1.5fr 0.9fr; align-items:center; padding:11px 16px; border-top:1px solid #E8E5DE; font-size:12.5px\">\n            <div style=\"color:#35342F; font-weight:500\">{{ t.role }}<\u002Fdiv>\n            <div style=\"color:#6A685F; font-family:ui-monospace, monospace; font-size:11.5px\">{{ t.value }}<\u002Fdiv>\n            <div style=\"color:#6A685F; font-family:ui-monospace, monospace; font-size:11.5px\">{{ t.token }}<\u002Fdiv>\n            <div style=\"color:#99958C; font-size:11.5px\">{{ t.cited }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; line-height:1.55; color:#99958C\">Three rows here are new work: the 44px touch target and the two icon sizes. Line-height stays a literal — §08 argues one property on chart text does not earn a shared token. Counting the gridline grey from the colour table above, that is four declarations in total, which is the set §04 and §08 both list. Everything else resolves against <code style=\"font-size:11px; color:#B54B6E\">_variables.scss<\u002Fcode> today, including both shadows — <code style=\"font-size:11px; color:#B54B6E\">.dropdown-menu<\u002Fcode> in <code style=\"font-size:11px; color:#B54B6E\">_bootstrap-override.scss<\u002Fcode> already binds <code style=\"font-size:11px; color:#B54B6E\">--inet-shadow-medium<\u002Fcode>, which is exactly the menu elevation §03 draws.<\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #7455A8; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Adjacent surfaces: everything drawn over the card<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#EDE8F5; color:#3D2070\">separate ticket<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Chart data points already have a styled hover tooltip — <code style=\"font-size:11px; color:#B54B6E\">[wTooltip]<\u002Fcode> on the plot, axis and legend areas in <code style=\"font-size:11px; color:#B54B6E\">chart-area.component.html<\u002Fcode>, rendered as <code style=\"font-size:11px; color:#B54B6E\">.widget__default-tooltip<\u002Fcode> or, when the chart's format sets <code style=\"font-size:11px; color:#B54B6E\">tooltipStyle: \"CARD\"<\u002Fcode>, as <code style=\"font-size:11px; color:#B54B6E\">.widget__card-tooltip<\u002Fcode> with its own three-tier hierarchy. It is the most prominent surface adjacent to the card, so it was audited against the same tokens.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>No rule in this spec applies to it.<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">w-tooltip<\u002Fcode> is <code style=\"font-size:11px; color:#B54B6E\">position:fixed<\u002Fcode> at z-index 999900, outside the card's box, so no §04 spacing anchor reaches it. It is already bound to <code style=\"font-size:11px; color:#B54B6E\">--inet-text-color<\u002Fcode>, <code style=\"font-size:11px; color:#B54B6E\">--inet-dialog-bg-color<\u002Fcode>, <code style=\"font-size:11px; color:#B54B6E\">--inet-default-border-color<\u002Fcode> and the <code style=\"font-size:11px; color:#B54B6E\">--inet-space-*<\u002Fcode> scale, with no palette collision against this spec. Five mechanical bindings remain on the tooltip itself — elevation, the tier opacities, the off-scale radii, one font size, and one rule that <code style=\"font-size:11px; color:#B54B6E\">.hidden__annotation-tooltip<\u002Fcode> duplicates property-for-property. A third class, <code style=\"font-size:11px; color:#B54B6E\">.chart__tooltip<\u002Fcode> in <code style=\"font-size:11px; color:#B54B6E\">chart-area.component.scss<\u002Fcode>, is not a copy of that rule but repeats the same off-scale 1px radius, so the radius fix has four call sites. Then one design proposal. All of it, together with the selection-highlight work below, is written up in <code style=\"font-size:11px; color:#B54B6E\">Chart overlay surfaces - ticket.md<\u002Fcode>. They are shell-wide classes, so they do not belong in a chart-card commit.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">The proposal: the CARD tooltip carries <strong>six type sizes<\u002Fstrong> (16 / 14 / 13 / 12 / 11 / 20px) for at most three levels of meaning, with 1px steps that read as inconsistency rather than hierarchy, and a 20px summary line larger than any permanent text in the shell. Decided: <strong>three roles<\u002Fstrong> — value 16, label 13, caption 11 — with weight and the <code style=\"font-size:11px; color:#B54B6E\">--inet-text-*<\u002Fcode> ramp carrying de-emphasis instead of opacity, and the summary line separated by a rule rather than enlarged. No fourth size for the stack total; it earns emphasis from position and a hairline rule, which is the one trade taken knowingly here.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">One dependency to respect either way: the outlined-text ticket requires naming a chart type scale before conversion. <strong>Name one ramp for both<\u002Fstrong> rather than minting two — whoever reaches it first defines it, and the 11px caption step is the likely shared floor with chart tick labels. A new <code style=\"font-size:11px; color:#B54B6E\">--inet-font-size-lg: 16px<\u002Fcode> is the only addition either needs, and is now committed.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#6A685F; border-top:1px solid #E8E5DE; padding-top:9px\">The same ticket now covers the <strong>selection highlight<\u002Fstrong>, for the same reason: it draws over the card but is not part of it. <code style=\"font-size:11px; color:#B54B6E\">ChartTool.drawRegions()<\u002Fcode> fills and strokes every selected region with <code style=\"font-size:11px; color:#B54B6E\">#dc581e<\u002Fcode> — an orange that is not in the palette — and applies the same 30% fill to a 20px bar and a 350px axis band alike. The fix needs no new token: the shipped <code style=\"font-size:11px; color:#B54B6E\">--inet-focus-ring-color<\u002Fcode> is already the primary at that alpha. Both parts are now decided: selection binds to the shipped focus family, and chrome selections (axis, legend, title) become stroke-only while data selections keep the fill — the two currently look identical while meaning different things.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#6A685F; border-top:1px solid #E8E5DE; padding-top:9px\">A sweep of the remaining overlays turned up one finding worth a reader's attention here, because it is a vocabulary problem rather than a value problem: <strong>the product marks \"selected\" three different ways<\u002Fstrong> — the canvas fill and stroke on chart regions, the shipped <code style=\"font-size:11px; color:#B54B6E\">--inet-focus-ring-*<\u002Fcode> family, and <code style=\"font-size:11px; color:#B54B6E\">border: 2px dotted darkgray<\u002Fcode> on a selected annotation. Settled: one vocabulary, the shipped focus family. The annotation border drops its dotted grey and is stroked like every other chrome selection. The ticket also records a second overlay scrim 0.1 alpha away from <code style=\"font-size:11px; color:#B54B6E\">--inet-overlay-scrim-bg-color<\u002Fcode>, and a data-tip layer that computes its own z-indexes instead of joining the shell's <code style=\"font-size:11px; color:#B54B6E\">$stacking-order<\u002Fcode> registry.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Counting the same way, the chart currently has <strong>four oranges<\u002Fstrong>: the primary <code style=\"font-size:11px; color:#B54B6E\">#E58A2A<\u002Fcode>, its hover <code style=\"font-size:11px; color:#B54B6E\">#C96F12<\u002Fcode>, the selection <code style=\"font-size:11px; color:#B54B6E\">#dc581e<\u002Fcode>, and <code style=\"font-size:11px; color:#B54B6E\">#ff8d41<\u002Fcode> on the Resize Plot sliders. Only the first two are in the palette. §07's claim that every colour resolves to a shipped token holds for the card itself — these are all on surfaces drawn <em>over<\u002Fem> it, and the ticket is where they are settled.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">08<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Binding to the shipped tokens<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Bind every value in §07 to a shipped <code style=\"font-size:12px; color:#B54B6E\">--inet-*<\u002Fcode> name on <code style=\"font-size:12px; color:#B54B6E\">epic-74519<\u002Fcode>. The shell's neutrals already match the mocks to the hex — <code style=\"font-size:12px; color:#B54B6E\">$shell-text-default: #35342F<\u002Fcode>, <code style=\"font-size:12px; color:#B54B6E\">$shell-border-default: #D9D5CC<\u002Fcode>, <code style=\"font-size:12px; color:#B54B6E\">$shell-surface-canvas: #F8F7F4<\u002Fcode> — so no colour is being changed. The work is four new declarations plus the Java constants below.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px\">\n        <div style=\"border:1px solid #D9D5CC; border-left:3px solid #2E8B57; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Bind these — all ship at the drawn value<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">no change<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Every colour §07 lists resolves to a shipped token at the value the mocks draw. Bind and move on — no reconciliation needed.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:0\">\n            <div style=\"display:grid; grid-template-columns:1.45fr 68px 1fr; gap:10px; padding-bottom:6px; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#99958C\"><span>Token<\u002Fspan><span>Value<\u002Fspan><span>Status<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ collisions }}\" as=\"c\" hint-placeholder-count=\"8\">\n              <div style=\"display:grid; grid-template-columns:1.45fr 68px 1fr; gap:10px; align-items:center; padding:8px 0; border-top:1px solid #E8E5DE; font-size:11px; font-family:ui-monospace, monospace\">\n                <span style=\"color:#35342F\">{{ c.name }}<\u002Fspan>\n                <span style=\"display:flex; align-items:center; gap:5px; color:#99958C\"><span style=\"flex:0 0 10px; height:10px; border-radius:2px; border:1px solid rgba(0,0,0,0.12); background:{{ c.shipped }}\"><\u002Fspan>{{ c.shippedLabel }}<\u002Fspan>\n                <span style=\"color:#6A685F\">{{ c.specLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Note the aliasing: <code style=\"font-size:11px; color:#B54B6E\">--inet-default-border-color<\u002Fcode> resolves through <code style=\"font-size:11px; color:#B54B6E\">--inet-shell-border-default<\u002Fcode>, and <code style=\"font-size:11px; color:#B54B6E\">--inet-card-bg-color<\u002Fcode> through <code style=\"font-size:11px; color:#B54B6E\">--inet-shell-surface-default<\u002Fcode>. Bind to the semantic name, not the shell primitive — that is the layer the theme overrides.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Four declarations to add<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">source edit<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">All four go in the <code style=\"font-size:11px; color:#B54B6E\">:root<\u002Fcode> block of <code style=\"font-size:11px; color:#B54B6E\">_variables.scss<\u002Fcode>, each beside the scale it extends. None touches an existing value, so none can reskin another component.<\u002Fdiv>\n          <div style=\"font-family:ui-monospace, monospace; font-size:11.5px; line-height:1.9; color:#35342F; padding:12px 13px; border-radius:4px; background:#F8F7F4\">--inet-subtle-border-color: #E8E5DE;<br>--inet-control-height-touch: 44px;<br>--inet-icon-size-sm: 12px;<br>--inet-icon-size-md: 18px;<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px; font-size:12px; line-height:1.55; color:#6A685F\">\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">The gridline grey<\u002Fstrong> sits between <code style=\"font-size:11px; color:#B54B6E\">--inet-shell-surface-hover<\u002Fcode> (#ECE9E2) and <code style=\"font-size:11px; color:#B54B6E\">--inet-shell-border-default<\u002Fcode> (#D9D5CC). It is the one genuinely missing member of the neutral ramp: an interior rule that must not compete with the card edge.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">The touch target<\u002Fstrong> exceeds the shipped <code style=\"font-size:11px; color:#B54B6E\">--inet-control-height-lg<\u002Fcode> of 36px. Name it rather than reuse <code style=\"font-size:11px; color:#B54B6E\">-lg<\u002Fcode>, so 44px reads as a hit-target floor and is never quietly reduced to fit a layout.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">The two icon sizes<\u002Fstrong> have no equivalent — <code style=\"font-size:11px; color:#B54B6E\">--inet-navbar-icon-size<\u002Fcode> is the only glyph token and is navbar-specific at 20px.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Line-height 1.2 is a fifth candidate, but it is one property on chart text rather than a shared scale — declare <code style=\"font-size:11px; color:#B54B6E\">--inet-chart-line-height<\u002Fcode> only if the chart ends up with a token group of its own. Otherwise a literal in the chart SCSS is honest.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">GDefaults greys — Java constants, not CSS<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">verified on epic-74519<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">These are the one part of the palette no CSS token reaches. <code style=\"font-size:11px; color:#B54B6E\">GDefaults.java<\u002Fcode> holds <code style=\"font-size:11px; color:#B54B6E\">java.awt.Color<\u002Fcode> constants read by the server-side Java2D renderer — <code style=\"font-size:11px; color:#B54B6E\">DEFAULT_TEXT_COLOR<\u002Fcode> 0x4b4b4b, <code style=\"font-size:11px; color:#B54B6E\">DEFAULT_TITLE_COLOR<\u002Fcode> 0x2b2b2b, <code style=\"font-size:11px; color:#B54B6E\">DEFAULT_GRIDLINE_COLOR<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">DEFAULT_LINE_COLOR<\u002Fcode> both 0xeeeeee, <code style=\"font-size:11px; color:#B54B6E\">DEFAULT_TARGET_LINE_COLOR<\u002Fcode> 0xafafad.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Two things to do. <strong>Separate the gridline from the axis line.<\u002Fstrong> They are already two constants holding the same 0xeeeeee, so §07's split is a one-line value change, not a refactor — but check the <code style=\"font-size:11px; color:#B54B6E\">DEFAULT_LINE_COLOR<\u002Fcode> comment first: it serves border colour as well as axis line, so changing it moves both. <strong>Change every server-rendered value in Java alongside its CSS token<\u002Fstrong>, or exported images drift from the browser.<\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Verify on three paths before landing: server-side image/PDF export, dark theme if chart theming exists, and a freshly created chart — a deserialised chart carries its own colours and will not expose the raw default. Two further constants: <code style=\"font-size:11px; color:#B54B6E\">TICK_MIN_GAP = 4<\u002Fcode> needs no action — it already equals <code style=\"font-size:11px; color:#B54B6E\">--inet-space-2<\u002Fcode>. The default fonts do: 9 / 10 / 11pt for small / text / title against the browser's 13px <code style=\"font-size:11px; color:#B54B6E\">--inet-font-size-base<\u002Fcode>, so the two renderers do not start from the same type size. Out of scope here — see §09.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">09<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Open items<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Temporary by design. Each item leaves this section as it is decided — resolved token work moves to §08. When the section is empty it goes away with the last card. All re-checked against <code style=\"font-size:12px; color:#B54B6E\">epic-74519<\u002Fcode>. Two items have left as their own tickets — the dead menu icons and the outlined-text conversion — because both are app-wide and neither gates the card. Two remain.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px\">\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Series palette — out of scope<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Handed off to the chart palette project, which owns both the selection mechanism and the palettes themselves. One finding worth carrying over: the pastels <code style=\"font-size:11px; color:#B54B6E\">#AAAFFF<\u002Fcode> / <code style=\"font-size:11px; color:#B54B6E\">#A4E786<\u002Fcode> are a shipped selectable palette, not drift — which is why they aren't in <code style=\"font-size:11px; color:#B54B6E\">CategoricalColorFrame<\u002Fcode>'s legacy 40. Series colour is the one thing on the card this spec does not govern; the mocks here use it only as sample data.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Dead menu icons — moved to its own ticket<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E9E4F2; color:#463A73\">separate ticket<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Resolved, and out of this spec's boundary. Only the toolbar renders <code style=\"font-size:11px; color:#B54B6E\">icon()<\u002Fcode>; the context menu never has, so every <code style=\"font-size:11px; color:#B54B6E\">fa fa-*<\u002Fcode> on a menu-only action is unreachable. The fix is deletion, not new glyphs — but it spans ~24 <code style=\"font-size:11px; color:#B54B6E\">*-actions.ts<\u002Fcode> files across tables, calendars, selections and shapes, which is a review radius the chart card should not carry.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\">Nothing here gates the chart card. The dead strings render nothing, so the card ships identically either way. Full finding — render split, both dead vocabularies, the file list and the typo evidence — is written up in <code style=\"font-size:11px; color:#B54B6E\">Dead menu icons - ticket.md<\u002Fcode>, ready to paste.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Text is outlined — accept it; conversion is its own project<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E9E4F2; color:#463A73\">separate ticket<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Chart labels render as path outlines — the SVG has zero <code style=\"font-size:11px; color:#B54B6E\">&lt;text&gt;<\u002Fcode> elements. Authors can set the font and the outlines follow, but <strong>no stylesheet can restyle chart type<\u002Fstrong>: changing <code style=\"font-size:11px; color:#B54B6E\">--inet-font-family<\u002Fcode> reskins the shell and leaves the chart untouched. Type reaches the chart only through its own format model or the server property.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The default family is <code style=\"font-size:11px; color:#B54B6E\">SreeEnv.getProperty(\"default.font.family\", \"Roboto\")<\u002Fcode> — <code style=\"font-size:11px; color:#B54B6E\">StyleFont<\u002Fcode>'s <code style=\"font-size:11px; color:#B54B6E\">\"Default\"<\u002Fcode> is a sentinel resolved to that at construction. Roboto is also in the shell stack and ships as <code style=\"font-size:11px; color:#B54B6E\">roboto-fontface<\u002Fcode>, so the two renderers agree on family by default.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>This spec treats outlined text as a given.<\u002Fstrong> Every rule in §04 and §06 is stated in geometry, not type styling, so nothing here depends on the conversion. Converting to <code style=\"font-size:11px; color:#B54B6E\">&lt;text&gt;<\u002Fcode> is one boolean at <code style=\"font-size:11px; color:#B54B6E\">SVGUtil.java:63<\u002Fcode> and a large amount of everything else — written up in <code style=\"font-size:11px; color:#B54B6E\">Outlined chart text - ticket.md<\u002Fcode>.<\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">One prerequisite is worth naming here because it is a token decision, not a rendering one: the server starts from <code style=\"font-size:11px; color:#B54B6E\">GDefaults<\u002Fcode> 9 / 10 / 11pt while the browser base is 13px. Name the chart's type scale at its current rendered sizes <em>before<\u002Fem> any conversion, or the switch silently re-lays out every chart. Also: if chart labels render in a different face than the shell, check the configured family is installed on the render host — the JDK falls back silently to <code style=\"font-size:11px; color:#B54B6E\">'Dialog'<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n        \n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Subtitle, deferred<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\"><code style=\"font-size:11px; color:#B54B6E\">TitleInfo<\u002Fcode> exposes one string and a visibility flag. A real subtitle is a model change with serialisation, property sheet, and migration attached — proposed separately. Still true on <code style=\"font-size:11px; color:#B54B6E\">epic-74519<\u002Fcode>: <code style=\"font-size:11px; color:#B54B6E\">vs-chart-model.ts<\u002Fcode> carries a bare <code style=\"font-size:11px; color:#B54B6E\">titleVisible: boolean<\u002Fcode>, the same shape as every other assembly model.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180},&quot;seriesPalette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vivid&quot;,&quot;pastels&quot;],&quot;default&quot;:&quot;vivid&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Palette&quot;},&quot;revealToolbar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;States&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const vivid = (this.props.seriesPalette ?? \"vivid\") === \"vivid\";\n    const ok = { bg: \"#E2F3E8\", fg: \"#1D5B39\" };\n    const warn = { bg: \"#F8E8CC\", fg: \"#7A4E10\" };\n    const bad = { bg: \"#F7DEDE\", fg: \"#7F2E2E\" };\n    const rows = [\n      [\"Chart / axis title\", \"#35342F\", \"--inet-text-color\", \"ships\", ok, \"#35342F\"],\n      [\"Tick + legend label\", \"#6A685F\", \"--inet-text-muted-color\", \"ships\", ok, \"#6A685F\"],\n      [\"Axis line\", \"#D9D5CC\", \"--inet-default-border-color\", \"ships\", ok, \"#D9D5CC\"],\n      [\"Page canvas\", \"#F8F7F4\", \"--inet-shell-surface-canvas\", \"ships\", ok, \"#F8F7F4\"],\n      [\"Card surface\", \"#FFFFFF\", \"--inet-card-bg-color\", \"ships\", ok, \"#FFFFFF\"],\n      [\"Gridline\", \"#E8E5DE\", \"--inet-subtle-border-color\", \"to add\", warn, \"#E8E5DE\"],\n      [\"Legend heading\", \"not drawn today\", \"--inet-text-subtle-color\", \"ships\", ok, \"#99958C\"],\n      [\"Toolbar button hover\", \"not drawn today\", \"--inet-shell-surface-hover\", \"ships\", ok, \"#ECE9E2\"],\n      [\"Primary / sel he plot's left edge — ragged left\", A_PLOT, \"centred on their tick\", A_TICK],\n      [\"X axis labels\", \"centred on their tick, or rotated from it\", A_TICK, \"top, below the plot\", A_PLOT],\n      [\"X axis title\", \"centred on the plot width — not the card\", A_PLOT, \"bottom, at the card inset\", A_CARD],\n      [\"Legend column\", \"starts 16px right of the plot, ends at the card inset\", A_PLOT, \"top-aligned to the plot top\", A_PLOT],\n      [\"Legend swatch + label\", \"swatch left, label 8px after it\", A_SIB, \"centred on each other\", A_SIB]\n    ];\n    const legendGaps = [\n      [\"Right — default\", \"16px to the plot's right edge; 12px card inset beyond it\", \"top-aligned to the plot top\", \"under heading\"],\n      [\"Left\", \"16px to the y-axis title; 12px card inset on its own left\", \"top-aligned to the plot top\", \"under heading\"],\n      [\"Top\", \"12px to the plot top; 8px below the title lane\", \"left-aligned to the plot's left edge\", \"under the row\"],\n      [\"Bottom\", \"12px to the x-axis title; 12px card inset below\", \"left-aligned to the plot's left edge\", \"above the row\"],\n      [\"Floating — IN_PLACE\", \"no gap rule — dropped at an arbitrary point\", \"an (x, y) offset from the chart's top-left, not aligned to anything\", \"none — panel returns\"]\n    ];\n    const bootstrapRows = [\n      [\"--inet-space-2\", \"4px\", \"axis title → its labels\"],\n      [\"--inet-space-4\", \"8px\", \"labels → plot, title box → lane rule\"],\n      [\"--inet-space-5\", \"12px\", \"card inset, all four edges\"],\n      [\"--inet-space-6\", \"16px\", \"plot → legend column\"],\n      [\"--inet-radius-md\", \"3px\", \"toolbar buttons, menu rows — also --bs-border-radius\"],\n      [\"--inet-radius-xl\", \"6px\", \"the card itself\"],\n      [\"--inet-shadow-low\", \"0 1px 2px / 0 1px 3px\", \"card elevation\"],\n      [\"--inet-shadow-medium\", \"0 2px 4px / 0 1px 6px\", \"menu popup — .dropdown-menu already uses it\"],\n      [\"--inet-control-height-sm\", \"24px\", \"collapsed-lane target\"],\n      [\"--inet-control-height-md\", \"30px\", \"comfortable target\"],\n      [\"--inet-font-size-base\", \"13px\", \"the default title size the lane math assumes\"],\n      \n      [\"--inet-text-color\", \"#35342F\", \"chart and axis titles — exact match\"],\n      [\"--inet-text-muted-color\", \"#6A685F\", \"tick and legend labels — exact match\"],\n      [\"--inet-shell-border-default\", \"#D9D5CC\", \"axis line — exact match\"]\n    ];\n    const SP = { 4: \"--inet-space-2\", 8: \"--inet-space-4\", 12: \"--inet-space-5\", 16: \"--inet-space-6\" };\n    const spacingRows = [\n      [\"Card border → any content\", \"12px\", fixed, SP[12]],\n      [\"↳ card top border → title box\", \"12px — the lane adds none\", fixed, SP[12]],\n      [\"Title box → lane rule\", \"8px\", fixed, SP[8]],\n      [\"Title text within the lane\", \"centred in the title box\", intrinsic, \"—\"],\n      [\"Lane rule → graph region\", \"8px\", fixed, SP[8]],\n      [\"1 · Plot\", \"the remainder\", elastic, \"—\"],\n      [\"Plot top → highest tick label\", \"½ label line-height\", intrinsic, \"—\"],\n      [\"4 · Y labels → plot left edge\", \"8px\", fixed, SP[8]],\n      [\"5 · Y axis title → y labels\", \"4px\", fixed, SP[4]],\n      [\"Y axis title → plot, labels hidden\", \"8px — inherits the labels' gap\", fixed, SP[8]],\n      [\"↳ card left border → y axis title\", \"12px — the card's inset again\", fixed, SP[12]],\n      [\"3 · X labels → plot bottom edge\", \"8px\", fixed, SP[8]],\n      [\"2 · X axis title → x labels\", \"4px\", fixed, SP[4]],\n      [\"X axis title → plot, labels hidden\", \"8px — inherits the labels' gap\", fixed, SP[8]],\n      [\"↳ x axis title → card bottom border\", \"12px — the card's inset\", fixed, SP[12]],\n      [\"6 · Plot → legend column\", \"16px\", fixed, SP[16]],\n      [\"Legend swatch → its label\", \"8px\", fixed, SP[8]],\n      [\"↳ legend column → card right border\",
