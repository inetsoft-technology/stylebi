rect>\n                  <rect x=\"138\" y=\"26\" width=\"24\" height=\"38\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"184\" y=\"91\" width=\"24\" height=\"25\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"184\" y=\"77\" width=\"24\" height=\"14\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"230\" y=\"65\" width=\"24\" height=\"51\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"230\" y=\"24\" width=\"24\" height=\"41\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"276\" y=\"84\" width=\"24\" height=\"32\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"276\" y=\"61\" width=\"24\" height=\"23\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"322\" y=\"74\" width=\"24\" height=\"42\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"322\" y=\"45\" width=\"24\" height=\"29\" fill=\"{{ s2 }}\"><\u002Frect>\n                <\u002Fg>\n              <\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">No lane, no rule, no reserved band — the plot starts at the card inset and keeps the height the title would have taken. The strip floats over the plot's top-right on a small surface, so it stays legible over gridlines and bars.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:6px; padding:11px 13px; border:1px solid #E8E5DE; border-radius:4px; background:#F8F7F4\">\n            <div style=\"font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#7A4E10\">Compact density — the third size<\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">§02 defines 30px comfortable and 44px touch. The overlaid strip uses the third shipped step at <strong>every card height<\u002Fstrong>: <code style=\"font-size:11px; color:#B54B6E\">--inet-control-height-sm<\u002Fcode> 24px target, 12px glyph, 2px padding inside its surface — the kebab is the same 24px square as the action buttons. Smaller because it sits over the plot rather than in a lane of its own, not because the card is short, so no height steps the <em>size<\u002Fem> down further. How the strip thins out and finally disappears as the card shrinks is §06's ladder, which owns that rule for both strips — this card fixes the size only. Because nothing is reserved, the size costs no height. It keeps the card's 12px inset from the top and right edges, so it aligns with the shown-title strip. On touch only the kebab renders (§02), at 44px — one control on its surface, covering a little more of the plot corner and never more of the card.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #2E8B57; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:11px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Why overlay rather than a condensed lane<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">decided<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The alternative was a collapsed lane of roughly 28–32px whenever the title is hidden. It reads more tidily in isolation and it is the wrong choice, for one reason that only appears at scale.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#E2F3E8\"><strong>Dashboards are pixel-positioned.<\u002Fstrong> A reserved lane means every title-hidden assembly in every saved dashboard gains ~30px of chrome and loses that much content — across a customer's whole portfolio, on upgrade, with no author action. Overlaying costs nothing and breaks nothing. The lane is free where a title already exists; where it does not, it is not worth a migration.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px; font-size:12px; line-height:1.55; color:#6A685F\">\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">Everything anchoring is for still holds.<\u002Fstrong> The strip moves with the assembly, stays inside its border, cannot cover a neighbour, and needs no viewport clamping — none of that depended on reserving space.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">The cost is honest:<\u002Fstrong> in this state the strip does cover a corner of the plot. It sits on <code style=\"font-size:11px; color:#B54B6E\">--inet-card-bg-color<\u002Fcode> at 94% with <code style=\"font-size:11px; color:#B54B6E\">--inet-shadow-low<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-md<\u002Fcode>, so it reads as a layer above the plot rather than a hole in it — and it is the top-right corner, which is empty on most chart types.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">Resting state still applies.<\u002Fstrong> The kebab is drawn at rest here too, on the same surface. A single dim glyph over the plot corner is the price of the object being discoverable at all when it has no title.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">This is the decision §02 flagged as app-wide. It is settled here for the chart and holds for all eight assembly types: <strong>a title-hidden assembly reserves nothing.<\u002Fstrong> For a table that means the strip covers the first row's right edge, for a selection list the first item's — both recoverable, both on hover, neither a layout change.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:12px; padding:18px; border:1px solid #D9D5CC; border-left:3px solid #C84C4C; border-radius:6px; background:#FFFFFF\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">A centred title must centre on the card, not on the leftover space<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F7DEDE; color:#7F2E2E\">watch<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Authors can set the chart title to centre alignment, and the anchored strip breaks it. If the strip is an ordinary flex sibling, the title's box ends where the strip begins, so \"centred\" resolves to the centre of what is left — visibly pushed left, and shifting again on hover as the strip's width changes with the selection.<\u002Fdiv>\n        <div style=\"display:flex; gap:16px; flex-wrap:wrap\">\n          <div style=\"flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:7px\">\n            <div style=\"display:flex; align-items:center; gap:7px\"><span style=\"font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:#7F2E2E\">Wrong — flex sibling<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative; border:1px solid #D9D5CC; border-radius:3px; background:#FFFFFF; overflow:hidden\">\n              <div style=\"display:flex; align-items:center; gap:8px; padding:12px 12px 8px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n                <div style=\"flex:1 1 auto; min-height:30px; display:grid; place-items:center\"><span style=\"font-size:10.5px; font-weight:600; line-height:1.2; color:#35342F\">Quantity by category<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:1px; flex-shrink:0\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"18\" height=\"18\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"18\" height=\"18\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"18\" height=\"18\" alt=\"Properties\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.76\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:34px\"><\u002Fdiv>\n              <div style=\"position:absolute; left:50%; top:0; bottom:0; width:1px; background:#C84C4C; opacity:0.55\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; line-height:1.5; color:#6A685F\">The title centres in the space the strip leaves, so it sits left of the card's true centre line.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:7px\">\n            <div style=\"display:flex; align-items:center; gap:7px\"><span style=\"font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:#1D5B39\">Right — strip overlays the lane<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative; border:1px solid #D9D5CC; border-radius:3px; background:#FFFFFF; overflow:hidden\">\n              <div style=\"position:relative; padding:12px 12px 8px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n                <div style=\"display:grid; place-items:center; min-height:30px; padding:0 123px\"><span style=\"font-size:10.5px; font-weight:600; line-height:1.2; color:#35342F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">Quantity by category<\u002Fspan><\u002Fdiv>\n                <div style=\"position:absolute; top:12px; right:12px; display:flex; gap:1px\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"18\" height=\"18\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"18\" height=\"18\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"18\" height=\"18\" alt=\"Properties\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; \"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.76\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:34px\"><\u002Fdiv>\n              <div style=\"position:absolute; left:50%; top:0; bottom:0; width:1px; background:#1D5B39; opacity:0.55\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; line-height:1.5; color:#6A685F\">The title box spans the full lane and centres on the card, reserving the strip's width at <em>both<\u002Fem> ends so a long centred title truncates symmetrically. The strip is positioned over the lane's right end.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>Rule:<\u002Fstrong> the title box is always the full lane width and the strip is <code style=\"font-size:11px; color:#B54B6E\">position:absolute<\u002Fcode> at the lane's right inset — for every alignment, not only centred, so one code path serves all three. Anchoring means the strip leaves the card's outside; it does not mean it becomes a flow sibling of the title.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Two consequences. A centred title needs symmetric reserved space, so the lane reserves the strip's width on <em>both<\u002Fem> ends — otherwise a long centred title is clipped asymmetrically. And a centred title can run under the strip, so the title needs its own right padding equal to the strip width when alignment is centre; left-aligned titles keep truncating with an ellipsis as today.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #2E8B57; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Long titles truncate — they never wrap<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">reuse existing directive<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The title stays one line and ends in an ellipsis. It must not wrap: the lane's height is what the plot box is anchored to, so a wrapping title would make lane height depend on string length — the same dashboard would reflow differently per chart, and the strip, absolutely positioned at the lane's top inset, would no longer sit centred against the title.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#E2F3E8\"><strong>Put <code style=\"font-size:11px; color:#B54B6E\">tooltipIf<\u002Fcode> on the title element.<\u002Fstrong> The directive ships at <code style=\"font-size:11px; color:#B54B6E\">widget/tooltip/tooltip-if.directive.ts<\u002Fcode> and does exactly this job: it compares <code style=\"font-size:11px; color:#B54B6E\">scrollWidth &gt; clientWidth<\u002Fcode> each change-detection pass and sets or removes a native <code style=\"font-size:11px; color:#B54B6E\">title<\u002Fcode> accordingly, so the tooltip appears only when the text is actually cut. Reads and writes go through <code style=\"font-size:11px; color:#B54B6E\">DomService<\u002Fcode>, so it does not thrash layout. No new component, no positioning code.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Native <code style=\"font-size:11px; color:#B54B6E\">title<\u002Fcode> is hover-only: no tooltip on touch, none on keyboard focus, and screen-reader support is inconsistent. Accepted here — it is what the mini-toolbar buttons already use (a native <code style=\"font-size:11px; color:#B54B6E\">title<\u002Fcode> bound to <code style=\"font-size:11px; color:#B54B6E\">action.label()<\u002Fcode> plus a <code style=\"font-size:11px; color:#B54B6E\">visually-hidden<\u002Fcode> span), so the card stays consistent with the toolbar beside it. If chart titles are later treated as essential content rather than a convenience, the richer <code style=\"font-size:11px; color:#B54B6E\">wTooltip<\u002Fcode> directive is the upgrade path. This matters most at the bottom of §06's ladder, where the title truncates hardest.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:14px; padding:16px 18px; border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF\">\n        <div style=\"font-size:13px; line-height:1.6; color:#35342F\">The lane spans the <strong>full card width<\u002Fstrong>, so the legend column starts below it. Otherwise the anchored toolbar and a top-right legend collide — which, with the rule-plus-list legend sitting top-right, is otherwise guaranteed.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">04<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Spacing — the card interior<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">The card is five nested boxes and <strong>only one of them is elastic<\u002Fstrong>. Axis label bands, axis title bands and the legend column size to their own content; the title lane takes the greater of its type box and the toolbar strip; the plot is whatever is left. Stating that is most of the spec — the numbers below are the default-density instance of it, not the rule. Each edge has exactly one owner, so no two rules ever apply to the same gap — and where a nested region does set its own inset, it replaces the card's rather than adding to it.<\u002Fp>\n\n      <div style=\"display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start\">\n        <div style=\"flex:1 1 420px; min-width:380px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">Nesting, outside in<\u002Fdiv>\n          <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:12px; display:flex; flex-direction:column; gap:0\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; padding-bottom:10px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n              <span style=\"font-size:11px; font-weight:600; color:#35342F\">Title<\u002Fspan>\n              <span style=\"display:flex; gap:2px\">\n                <span style=\"width:14px; height:14px; border-radius:2px; background:#F1EFEA\"><\u002Fspan>\n                <span style=\"width:14px; height:14px; border-radius:2px; background:#F1EFEA\"><\u002Fspan>\n                <span style=\"width:14px; height:14px; border-radius:2px; background:#F1EFEA\"><\u002Fspan>\n                <span style=\"width:10px; height:14px; border-radius:2px; background:#E8E5DE\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:6px; padding-top:10px; align-items:flex-start\">\n              <div style=\"flex:0 0 14px; height:96px; writing-mode:vertical-rl; transform:rotate(180deg); background:#F6E2C8; border-radius:2px; display:grid; place-items:center; font-size:9px; font-weight:600; letter-spacing:0.3px; color:#7A4E10\">5<\u002Fdiv>\n              <div style=\"flex:0 0 30px; height:96px; background:#FBEEDC; border-radius:2px; display:grid; place-items:center; font-size:9px; font-weight:600; letter-spacing:0.3px; color:#7A4E10\">4<\u002Fdiv>\n              <div style=\"flex:1 1 auto; display:flex; flex-direction:column; gap:6px\">\n                <div style=\"height:96px; border-radius:2px; background:#EAF4EC; display:grid; place-items:center; font-size:9px; font-weight:600; letter-spacing:0.3px; color:#1D5B39\">1 · PLOT — the remainder<\u002Fdiv>\n                <div style=\"height:14px; background:#FBEEDC; border-radius:2px; display:grid; place-items:center; font-size:9px; font-weight:600; letter-spacing:0.3px; color:#7A4E10\">3<\u002Fdiv>\n                <div style=\"height:14px; background:#F6E2C8; border-radius:2px; display:grid; place-items:center; font-size:9px; font-weight:600; letter-spacing:0.3px; color:#7A4E10\">2<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:0 0 52px; height:96px; margin-left:10px; background:#EDEAF6; border-radius:2px; display:grid; place-items:center; font-size:9px; font-weight:600; letter-spacing:0.3px; color:#463A73\">6<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; flex-wrap:wrap; font-size:10.5px; color:#99958C\">\n            <span style=\"display:flex; align-items:center; gap:5px\"><span style=\"width:10px; height:10px; border-radius:2px; background:#EAF4EC\"><\u002Fspan>elastic<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px\"><span style=\"width:10px; height:10px; border-radius:2px; background:#F6E2C8\"><\u002Fspan>axis title — intrinsic<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px\"><span style=\"width:10px; height:10px; border-radius:2px; background:#FBEEDC\"><\u002Fspan>axis labels — intrinsic<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px\"><span style=\"width:10px; height:10px; border-radius:2px; background:#EDEAF6\"><\u002Fspan>legend — intrinsic<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 100%; display:flex; flex-direction:column; gap:11px; padding:18px; border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Hidden means zero — including the gap and the rule<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">rule<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Authors hide the title, either axis title, either axis labels and the legend independently. A hidden element contributes <strong>no height, no width, and no gap<\u002Fstrong> — the plot claims the space. Every gap in the table belongs to the element on the content side of the arrow, so it disappears with it; there is no such thing as a reserved band for something not drawn.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px; font-size:12px; line-height:1.55; color:#6A685F\">\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">The lane rule belongs to the title, not to the card.<\u002Fstrong> Hide the title and the 1px divider goes with it — there is no band left to underline, and a rule under nothing reads as an empty one. This is the one piece of chrome that could plausibly be treated as a card fixture, so it is worth naming: it is not.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">And the lane goes with it.<\u002Fstrong> §03 covers why — nothing is reserved, so the plot claims the whole band and the strip overlays its top-right corner. The tick label's clearance comes from the plot's own internal padding, not from a lane, so hiding the title costs the plot nothing and reflows no existing dashboard.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Axis titles and label bands vanish entirely<\u002Fstrong>, along with their 4px and 8px gaps, and the chain closes up: with the y labels hidden but the axis title kept, the title sits 8px from the plot — it inherits the gap of whatever it now abuts, rather than keeping its own 4px. Hide both and the plot's left edge reaches the card's 12px inset. No band ever degrades to an empty stub.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">The legend takes its 16px with it.<\u002Fstrong> With no legend the plot runs to the card's right inset. The four <code style=\"font-size:11px; color:#B54B6E\">↳<\u002Fcode> rows name the all-visible case; read each as \"outermost <em>visible<\u002Fem> content → card border, 12px\", since any of the four named regions can be absent.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 100%; display:flex; flex-direction:column; gap:11px; padding:18px; border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Where text height comes from<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">rule<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Every intrinsic band in the table is a line box, not a pixel value: its height is the font size times the line-height, and authors change both per chart. So no band can be given a fixed height — the spec fixes the <em>gaps<\u002Fem> and lets the type determine the rest.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px; font-size:12px; line-height:1.55; color:#6A685F\">\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Line-height 1.2 for all chart text<\u002Fstrong> (<code style=\"font-size:11px; color:#B54B6E\">--inet-chart-line-height<\u002Fcode>) — title, axis titles, tick labels and legend labels. Tight enough that a two-line title does not look loose, loose enough that descenders never clip. This is the one type value this spec adds; sizes stay with the author.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Title lane height<\u002Fstrong> = title line box + 12px above + 8px below — <em>or<\u002Fem> the strip's height plus the same gaps, whichever is greater. At the default 13px title the line box is ~16px, so the 30px strip wins and drives the lane; the title only takes over above roughly 24px type. <strong>When the strip governs, the title centres vertically in that band<\u002Fstrong>, so at default type the text top sits ~20px below the card border while its box still starts at 12px. Only the box edge is a spacing rule; the text position falls out of the centring.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Axis label bands<\u002Fstrong> = the longest label's line box, plus its 8px gap to the plot. Rotated x labels use the rotated bounding box, which is why a long category axis can consume a third of the card and still be correct.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Consequence worth stating in review: because the strip sets the lane height at normal type sizes, changing the touch target from 30px to 44px makes every card's lane taller and every plot shorter. That is the real cost of the touch density, and it is why 44px applies on touch only.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 340px; min-width:320px; display:flex; flex-direction:column; gap:0\">\n          <div style=\"display:grid; grid-template-columns:1.2fr auto 132px 74px; gap:10px; padding-bottom:7px; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#99958C\">\n            <span>Gap<\u002Fspan><span>Default<\u002Fspan><span>Token<\u002Fspan><span style=\"text-align:right\">Behaviour<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ spacing }}\" as=\"g\" hint-placeholder-count=\"9\">\n            <div style=\"display:grid; grid-template-columns:1.2fr auto 132px 74px; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid #E8E5DE; font-size:12px\">\n              <span style=\"color:#35342F\">{{ g.label }}<\u002Fspan>\n              <span style=\"color:#6A685F; font-family:ui-monospace, monospace; font-size:11px\">{{ g.value }}<\u002Fspan>\n              <span style=\"color:#99958C; font-family:ui-monospace, monospace; font-size:10.5px\">{{ g.token }}<\u002Fspan>\n              <span style=\"font-size:9.5px; font-weight:600; letter-spacing:0.3px; padding:2px 6px; border-radius:3px; background:{{ g.bg }}; color:{{ g.fg }}; justify-self:end\">{{ g.kind }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex; flex-direction:column; gap:6px; border-top:1px solid #E8E5DE; padding-top:10px; margin-top:2px\">\n            <div style=\"display:flex; flex-direction:column; gap:7px; padding:11px 13px; border-radius:4px; background:#F8F7F4\">\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#7A4E10\">The left edge as a chain<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:0; flex-wrap:wrap; font-size:10.5px; font-family:ui-monospace, monospace; color:#6A685F\">\n                <span style=\"padding:3px 7px; border-radius:2px; background:#EFEDE7; color:#35342F\">card border<\u002Fspan>\n                <span style=\"padding:0 5px; color:#B38A46\">12→<\u002Fspan>\n                <span style=\"padding:3px 7px; border-radius:2px; background:#F6E2C8; color:#7A4E10\">y axis title<\u002Fspan>\n                <span style=\"padding:0 5px; color:#B38A46\">4→<\u002Fspan>\n                <span style=\"padding:3px 7px; border-radius:2px; background:#FBEEDC; color:#7A4E10\">y labels<\u002Fspan>\n                <span style=\"padding:0 5px; color:#B38A46\">8→<\u002Fspan>\n                <span style=\"padding:3px 7px; border-radius:2px; background:#EAF4EC; color:#1D5B39\">plot<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.55; color:#35342F\">Each number is the gap between the two boxes it sits between, so they are consecutive, not competing. The plot's left edge is 12 + title width + 4 + label width + 8 from the card border — the 8px is measured from the labels, not from the card, and nothing on this edge is applied twice. Reading a single row in isolation is what makes it look additive.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#35342F\"><strong>Gaps do not stack.<\u002Fstrong> The card's 12px inset is what sits between the card border and the outermost content on each side; the title lane, the y-axis title, the x-axis title and the legend column add no edge padding of their own. So the card's top border to the title <em>box<\u002Fem> is 12px, not 12 + a lane padding — the text itself sits lower, because it centres inside a box the strip makes taller than the type (see the height rules below). The <code style=\"font-size:11px; color:#B54B6E\">↳<\u002Fcode> rows restate that same 12px from all four edges to make it explicit — they are not additional gaps. There is no exception: when the title is hidden the strip overlays the plot at the same 12px from the top and right borders, so one inset governs every edge in every state.<\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#99958C\">The <strong>Token<\u002Fstrong> column names the shipped <code style=\"font-size:11px; color:#B54B6E\">--inet-space-*<\u002Fcode> steps, not a new namespace: 4 / 8 / 16px are steps 1, 2 and 3 in the pinned 5.2.3 and resolve today, so three of the four values need nothing created. Only the 12px inset is an addition — one <code style=\"font-size:11px; color:#B54B6E\">.75rem<\u002Fcode> step merged into the map, keyed outside Bootstrap's 0–5 range so no existing utility shifts. Code should carry the step, never the literal. The px column stays because a spec has to be reviewable by eye and because three rows have no token at all: one is a line box, one is a centring rule, and one is the plot remainder. Every value is a multiple of 4px, so 4 / 8 / 12 / 16 covers the whole table — Bootstrap already supplies three of those four. The one exception is the plot's top clearance, which is typographic: half the tick label's line-height, so it tracks font size rather than sitting on the scale at all.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:column; gap:12px; padding:18px; border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Alignment — what each element anchors to<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">rule<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Spacing says how far apart things sit; alignment says what they line up with, and the two are independent. Five anchors exist in the card — the <strong>card inset<\u002Fstrong>, the <strong>plot box<\u002Fstrong>, a <strong>tick<\u002Fstrong>, the <strong>title lane<\u002Fstrong>, and a <strong>sibling<\u002Fstrong> element — and every element uses exactly one on each axis, often a different one per axis. Both are named per row below.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:0\">\n          <div style=\"display:grid; grid-template-columns:0.95fr 1.2fr 62px 1.2fr 62px; gap:10px; padding-bottom:7px; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#99958C\">\n            <span>Element<\u002Fspan><span>Horizontal<\u002Fspan><span>Anchor<\u002Fspan><span>Vertical<\u002Fspan><span>Anchor<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ alignment }}\" as=\"a\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid; grid-template-columns:0.95fr 1.2fr 62px 1.2fr 62px; gap:10px; align-items:baseline; padding:8px 0; border-top:1px solid #E8E5DE; font-size:12px; line-height:1.5\">\n              <span style=\"color:#35342F\">{{ a.element }}<\u002Fspan>\n              <span style=\"color:#6A685F\">{{ a.h }}<\u002Fspan>\n              <span style=\"font-size:9.5px; font-weight:600; letter-spacing:0.3px; padding:2px 6px; border-radius:3px; background:{{ a.hBg }}; color:{{ a.hFg }}; justify-self:start\">{{ a.hAnchor }}<\u002Fspan>\n              <span style=\"color:#6A685F\">{{ a.v }}<\u002Fspan>\n              <span style=\"font-size:9.5px; font-weight:600; letter-spacing:0.3px; padding:2px 6px; border-radius:3px; background:{{ a.vBg }}; color:{{ a.vFg }}; justify-self:start\">{{ a.vAnchor }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:7px; padding:11px 13px; border-radius:4px; background:#F8F7F4\">\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F\"><strong>The consequential one: two different centres.<\u002Fstrong> A centred chart title centres on the <em>card<\u002Fem>; the x-axis title centres on the <em>plot<\u002Fem>. Those are not the same vertical — the y-axis band pushes the plot right, and a right-placed legend pulls it back left — so the two centred elements will not sit above one another, and that is correct. Centring the x-axis title on the card instead would leave it visibly off its own axis.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F\">The y-axis labels are the only right-aligned text in the card. Their ragged left edge is intended: number labels must line up on their last digit against the axis, which is also why a wide outlier value widens the band rather than overflowing it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px\">\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:11px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">One left edge, not three<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">What makes a chart read as <em>inside<\u002Fem> a card rather than dropped on one is a single shared inset. The title, the y-axis title and the x-axis title all start at the same 12px from the card border. Not every element aligns to that edge, though, and the ones that do not are not exceptions so much as a second rule — the table above gives each element its own anchor.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The title lane needs no left or right rule of its own for the same reason: it takes the card's 12px inset, so the title starts on the same vertical as the y-axis title below it, and the strip's right edge lands on the same vertical as the legend's. A left-placed legend changes nothing — it too begins at the shared inset. One number governs every vertical in the card.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The plot never touches the card border on any side. Where a chart has no y-axis (a pie, a treemap), the 12px inset still holds — the plot widens into the label band, it does not run to the edge.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:11px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Set the graph's own outer margin to zero<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">source edit<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The rendered graph reserves its own margin between the image bounds and its outermost content — the sample asset's bands sit inset before any card padding exists. Put the card's 12px around that and the two stack, so the axis sides read visibly looser than the title side, which sits inside the lane and escapes the doubling.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>The change:<\u002Fstrong> zero the SVG's outer margin so the graph draws to its own bounds, and let the card's 12px be the only edge inset. Scope it precisely — this is the empty band <em>outside<\u002Fem> the outermost drawn element, nothing else. Every gap the table lists is interior and stays: the 4px between an axis title and its labels, the 8px between labels and the plot, the 16px to the legend. Only the perimeter reservation goes.<\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Verify at render, not in a mock — every mock in this document draws the intended result, so none will show the doubling. The tell is a plot with too much air on the axis sides and comparatively little under the title.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-left:3px solid #2E8B57; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:11px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n            <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Bind to the shipped tokens — don't create new ones<\u002Fdiv>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">verified on epic-74519<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\"><code style=\"font-size:11px; color:#B54B6E\">_variables.scss<\u002Fcode> on <code style=\"font-size:11px; color:#B54B6E\">epic-74519<\u002Fcode> already declares spacing, radius, elevation, control heights and the neutral ramp in <code style=\"font-size:11px; color:#B54B6E\">:root<\u002Fcode>. <strong>Use those names for every value §04 draws.<\u002Fstrong> Card inset 12px → <code style=\"font-size:11px; color:#B54B6E\">--inet-space-5<\u002Fcode>; card radius 6px → <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-xl<\u002Fcode>; card shadow → <code style=\"font-size:11px; color:#B54B6E\">--inet-shadow-low<\u002Fcode>. No Bootstrap <code style=\"font-size:11px; color:#B54B6E\">$spacers<\u002Fcode> change is needed — <code style=\"font-size:11px; color:#B54B6E\">--bs-border-radius<\u002Fcode> already resolves to <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-md<\u002Fcode>.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:0\">\n            <div style=\"display:grid; grid-template-columns:1fr 0.85fr 1.25fr; gap:12px; padding-bottom:6px; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#99958C\">\n              <span>Shipped token<\u002Fspan><span>Value<\u002Fspan><span>Used for<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ bootstrap }}\" as=\"b\" hint-placeholder-count=\"9\">\n              <div style=\"display:grid; grid-template-columns:1fr 0.85fr 1.25fr; gap:12px; align-items:baseline; padding:7px 0; border-top:1px solid #E8E5DE; font-size:11.5px; font-family:ui-monospace, monospace\">\n                <span style=\"color:#35342F\">{{ b.step }}<\u002Fspan>\n                <span style=\"color:#99958C\">{{ b.bs }}<\u002Fspan>\n                <span style=\"color:#6A685F\">{{ b.spec }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#E2F3E8\"><strong>Add four <code style=\"font-size:11px; color:#B54B6E\">:root<\u002Fcode> declarations<\u002Fstrong> — gridline grey <code style=\"font-size:11px; color:#B54B6E\">#E8E5DE<\u002Fcode>, the 44px touch target, and the two glyph sizes. Written out verbatim in §08. Additive only, in the block that already holds their neighbours; ship them in the same commit as the card. Nothing is blocked on them — the chart renders identically with the literals. Chart line-height 1.2 stays a literal (§08).<\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Two target sizes are specified at 30px (comfortable, in the title lane) and 24px (the overlaid strip) so both land on shipped <code style=\"font-size:11px; color:#B54B6E\">--inet-control-height-*<\u002Fcode> steps; the §02 and §03 mocks are drawn at those sizes. Only the 44px touch step sits outside the scale — it is a hit-target floor, not a visual size.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">05<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Legend — panel to rule<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:20px; flex-wrap:wrap\">\n        <div style=\"flex:0 1 240px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">Shipped<\u002Fdiv>\n          <div style=\"padding:18px; border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; display:grid; place-items:center\">\n            <div style=\"border:1px solid #B9B4A8; background:#FFFFFF; padding:6px 10px 8px; display:flex; flex-direction:column; gap:5px; min-width:104px\">\n              <div style=\"font-size:10px; color:#35342F\">Region<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:6px\"><span style=\"width:9px; height:9px; border-radius:50%; background:#A4E786\"><\u002Fspan><span style=\"font-size:10px; color:#35342F\">USA West<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:6px\"><span style=\"width:9px; height:9px; border-radius:50%; background:#AAAFFF\"><\u002Fspan><span style=\"font-size:10px; color:#35342F\">USA East<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Bordered panel, circular swatches, pastel series.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 1 240px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">Aligned<\u002Fdiv>\n          <div style=\"padding:18px; border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; display:grid; place-items:center\">\n            <div style=\"display:flex; flex-direction:column; gap:6px; min-width:104px\">\n              <div style=\"font-size:9px; font-weight:600; letter-spacing:0.5px; color:#99958C\">REGION<\u002Fdiv>\n              <div style=\"height:1px; background:#D9D5CC\"><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"width:9px; height:9px; border-radius:2px; background:{{ s2 }}\"><\u002Fspan><span style=\"font-size:10px; color:#35342F\">USA West<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"width:9px; height:9px; border-radius:2px; background:{{ s1 }}\"><\u002Fspan><span style=\"font-size:10px; color:#35342F\">USA East<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Heading, 1px rule, square swatches. No fill or border.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px; min-width:240px; display:flex; flex-direction:column; gap:9px\">\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F\">This is the one change with layout consequences: dropping the panel border and fill returns roughly 8–10px of horizontal room, so the plot's right edge and the legend column must be re-measured at real render sizes — not at the mockups' 1100×620.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin:12px 0 0; font-size:15px; font-weight:600; color:#1F1F1B\">Placement — five author choices<\u002Fh3>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Placement is author-set — <code style=\"font-size:12px; color:#B54B6E\">LegendOption<\u002Fcode> is <code style=\"font-size:12px; color:#B54B6E\">TOP<\u002Fcode>, <code style=\"font-size:12px; color:#B54B6E\">RIGHT<\u002Fcode>, <code style=\"font-size:12px; color:#B54B6E\">BOTTOM<\u002Fcode>, <code style=\"font-size:12px; color:#B54B6E\">LEFT<\u002Fcode>, <code style=\"font-size:12px; color:#B54B6E\">IN_PLACE<\u002Fcode> or <code style=\"font-size:12px; color:#B54B6E\">NO_LEGEND<\u002Fcode> — so the rule-plus-list treatment has to hold in every position. Two things change with orientation: where the 1px rule goes, and whether the list stacks or flows.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(196px, 1fr)); gap:16px\">\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden; display:flex; flex-direction:column\">\n          <div style=\"padding:14px 14px 10px; display:flex; gap:7px; align-items:flex-start\">\n            <div style=\"flex:1 1 auto; height:74px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv>\n            <div style=\"flex:0 0 46px; display:flex; flex-direction:column; gap:4px\">\n              <div style=\"height:4px; width:26px; border-radius:1px; background:#C8C2B7\"><\u002Fdiv>\n              <div style=\"height:1px; background:#D9D5CC\"><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s2 }}\"><\u002Fspan><span style=\"height:4px; flex:1; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s1 }}\"><\u002Fspan><span style=\"height:4px; flex:1; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 14px 14px; display:flex; flex-direction:column; gap:5px\">\n            <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Right<\u002Fspan><span style=\"font-size:9px; font-weight:600; letter-spacing:0.3px; padding:2px 6px; border-radius:3px; background:#F6E2C8; color:#7A4E10\">DEFAULT<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Rule under the heading, list stacks. Width from longest label.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden; display:flex; flex-direction:column\">\n          <div style=\"padding:14px 14px 10px; display:flex; gap:7px; align-items:flex-start\">\n            <div style=\"flex:0 0 46px; display:flex; flex-direction:column; gap:4px\">\n              <div style=\"height:4px; width:26px; border-radius:1px; background:#C8C2B7\"><\u002Fdiv>\n              <div style=\"height:1px; background:#D9D5CC\"><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s2 }}\"><\u002Fspan><span style=\"height:4px; flex:1; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s1 }}\"><\u002Fspan><span style=\"height:4px; flex:1; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1 1 auto; height:74px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 14px 14px; display:flex; flex-direction:column; gap:5px\">\n            <div style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Left<\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Mirrored, not reversed — swatch stays left of its label. Needs a gap token so it never crowds the y-axis labels now sitting between it and the plot.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden; display:flex; flex-direction:column\">\n          <div style=\"padding:14px 14px 10px; display:flex; flex-direction:column; gap:6px\">\n            <div style=\"display:flex; gap:8px; align-items:center\">\n              <div style=\"height:4px; width:22px; border-radius:1px; background:#C8C2B7\"><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s2 }}\"><\u002Fspan><span style=\"height:4px; width:20px; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s1 }}\"><\u002Fspan><span style=\"height:4px; width:20px; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:1px; background:#D9D5CC\"><\u002Fdiv>\n            <div style=\"height:56px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 14px 14px; display:flex; flex-direction:column; gap:5px\">\n            <div style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Top<\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Its own band <em>below<\u002Fem> the top lane — never inside it, or it fights the toolbar. Rule moves under the row, heading inline before the items.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden; display:flex; flex-direction:column\">\n          <div style=\"padding:14px 14px 10px; display:flex; flex-direction:column; gap:6px\">\n            <div style=\"height:56px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv>\n            <div style=\"height:1px; background:#D9D5CC\"><\u002Fdiv>\n            <div style=\"display:flex; gap:8px; align-items:center\">\n              <div style=\"height:4px; width:22px; border-radius:1px; background:#C8C2B7\"><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s2 }}\"><\u002Fspan><span style=\"height:4px; width:20px; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s1 }}\"><\u002Fspan><span style=\"height:4px; width:20px; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 14px 14px; display:flex; flex-direction:column; gap:5px\">\n            <div style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Bottom<\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Rule above the row, below the x-axis title. Wraps to multiple rows and grows the band rather than truncating labels.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #C8C2B7; border-radius:6px; background:#FFFFFF; overflow:hidden; display:flex; flex-direction:column\">\n          <div style=\"padding:14px 14px 10px; position:relative\">\n            <div style=\"height:74px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv>\n            <div style=\"position:absolute; top:22px; right:24px; display:flex; flex-direction:column; gap:4px; padding:6px 8px; border-radius:3px; background:rgba(255,255,255,0.92); border:1px solid #D9D5CC; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04)\">\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s2 }}\"><\u002Fspan><span style=\"height:4px; width:18px; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; gap:3px; align-items:center\"><span style=\"width:6px; height:6px; border-radius:1px; background:{{ s1 }}\"><\u002Fspan><span style=\"height:4px; width:18px; border-radius:1px; background:#E8E5DE\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 14px 14px; display:flex; flex-direction:column; gap:5px\">\n            <div style=\"display:flex; align-items:center; gap:8px\"><span style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Floating<\u002Fspan><span style=\"font-size:9px; font-weight:600; letter-spacing:0.3px; padding:2px 6px; border-radius:3px; background:#F7DEDE; color:#7F2E2E\">EXCEPTION<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">The one place the panel survives. Freely positioned by the author, so there is no clean ground beneath it — it keeps a translucent surface, hairline border and low shadow, or swatches and labels collide with gridlines and bars.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #7455A8; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:9px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Floating is a drag result, not a fifth dock<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E3EFE6; color:#1D5B39\">verified in repo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">All five come from one interaction. <code style=\"font-size:11px; color:#B54B6E\">chart-legend-container.component.ts<\u002Fcode> tracks the drag and classifies the drop by whether the legend has been pulled <em>past<\u002Fem> a chart edge — <code style=\"font-size:11px; color:#B54B6E\">newTop &lt; chartRect.top<\u002Fcode>, <code style=\"font-size:11px; color:#B54B6E\">newLeft &lt; chartRect.left<\u002Fcode>, or the trailing edge beyond the chart's right or bottom. Cross one and the legend docks to that side, and a preview outline one tenth of the chart's width or height is drawn to show where it will pin. Drop it anywhere inside the chart and the area is <code style=\"font-size:11px; color:#B54B6E\">CENTER<\u002Fcode>: <code style=\"font-size:11px; color:#B54B6E\">VSChartMoveLegendService<\u002Fcode> then sets <code style=\"font-size:11px; color:#B54B6E\">IN_PLACE<\u002Fcode> and stores the raw <code style=\"font-size:11px; color:#B54B6E\">Point2D<\u002Fcode> on the <code style=\"font-size:11px; color:#B54B6E\">LegendDescriptor<\u002Fcode>.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F\"><strong>So the floating legend has no anchor and no gap.<\u002Fstrong> Its position is whatever point the author dropped it at, held as an offset from the chart's top-left — it can overlap the plot, sit in the margin, or straddle both. This spec must not give it a spacing rule; the surface treatment is the only thing it can specify.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Resize follows the same split: a docked legend resizes only on its plot-facing edge (<code style=\"font-size:11px; color:#B54B6E\">getResizeEdges()<\u002Fcode> — <code style=\"font-size:11px; color:#B54B6E\">RIGHT<\u002Fcode> gets <code style=\"font-size:11px; color:#B54B6E\">LEFT<\u002Fcode>, and so on), and is clamped to half the chart. Floating resizes from right and bottom, and falls through to the default clamp of 0 to the full chart width. Both drags need a target big enough to grab — see §03's control sizing.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin:12px 0 0; font-size:15px; font-weight:600; color:#1F1F1B\">Gaps and alignment, per placement<\u002Fh3>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Swatch, label and row geometry is identical in all five; what changes with placement is the outer gap, the rule and the surface. Every value is a shipped <code style=\"font-size:11px; color:#B54B6E\">--inet-space-*<\u002Fcode> step — 4 / 8 / 12 / 16px are <code style=\"font-size:11px; color:#B54B6E\">-2<\u002Fcode>, <code style=\"font-size:11px; color:#B54B6E\">-4<\u002Fcode>, <code style=\"font-size:11px; color:#B54B6E\">-5<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">-6<\u002Fcode>, all resolving on epic-74519 (§04).<\u002Fp>\n      <div style=\"border:1px solid #D9D5CC; border-radius:6px; overflow:hidden; background:#FFFFFF\">\n        <div style=\"display:grid; grid-template-columns:1fr 1.3fr 1.15fr 74px; font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:#99958C; background:#F1EFEA; padding:10px 16px\">\n          <div>Placement<\u002Fdiv><div>Outer gap — legend to<\u002Fdiv><div>Alignment<\u002Fdiv><div>Rule<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ legendGaps }}\" as=\"l\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid; grid-template-columns:1fr 1.3fr 1.15fr 74px; gap:10px; align-items:baseline; padding:10px 16px; border-top:1px solid #E8E5DE; font-size:12.5px\">\n            <div style=\"font-weight:600; color:#1F1F1B\">{{ l.where }}<\u002Fdiv>\n            <div style=\"color:#6A685F\">{{ l.gap }}<\u002Fdiv>\n            <div style=\"color:#6A685F\">{{ l.align }}<\u002Fdiv>\n            <div style=\"font-size:11.5px; color:#99958C\">{{ l.rule }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:14px\">\n        <div style=\"flex:1 1 300px; min-width:280px; padding:14px 16px; border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Swatch and row geometry — same in all five<\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.6; color:#6A685F\">Swatch 9×9px at a <strong>2px<\u002Fstrong> radius — this is <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-sm<\u002Fcode>, deliberately not <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-md-sm<\u002Fcode>, because 4px on a 9px square reads as a lozenge rather than a square chip. This is the one radius in the spec that stays a literal: it is a glyph, not a surface. Swatch to label <strong>8px<\u002Fstrong>, centred on each other. Row to row <strong>4px<\u002Fstrong>. In the four docked placements, heading to rule <strong>4px<\u002Fstrong> and rule to first row <strong>8px<\u002Fstrong>; floating has no rule, so its heading sits <strong>4px<\u002Fstrong> above the first row inside the panel. Labels never truncate — the column takes its width from the longest one.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 300px; min-width:280px; padding:14px 16px; border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF; display:flex; flex-direction:column; gap:7px\">\n          <div style=\"font-size:12.5px; font-weight:600; color:#1F1F1B\">Left is the tight one<\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.6; color:#6A685F\">Left-placed, the legend no longer touches the plot — the y-axis title and its labels sit between them. So the 16px is measured to the <em>y-axis title<\u002Fem>, not the plot, and the legend column keeps the card's 12px inset on its own left edge. Without that, the legend's labels and the y labels read as one ragged block of text.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:14px; padding:16px 18px; border:1px solid #D9D5CC; border-left:3px solid #7455A8; border-radius:6px; background:#FFFFFF\">\n        <div style=\"font-size:13px; line-height:1.6; color:#35342F\">The rule-plus-list treatment depends on the card surface as its ground. That assumption holds for the four docked placements and breaks for floating — which is why floating is specified as a surface, not as a position variant. Any future placement over data inherits the same exception.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">06<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Degradation order<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Authors resize freely, so the card must have a documented order in which things go. Each step fires only when the step above cannot buy enough room. Steps 1–5 are about <em>width and content<\u002Fem>; the toolbar has its own ladder, driven by height, specified below them.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:1px; border:1px solid #D9D5CC; border-radius:6px; overflow:hidden; background:#D9D5CC\">\n        <div style=\"display:flex; gap:14px; align-items:center; padding:13px 16px; background:#FFFFFF\"><span style=\"flex:0 0 20px; font-size:11px; font-weight:700; color:#E58A2A\">1<\u002Fspan><span style=\"font-size:13px; color:#35342F\">Tick label density thins — fewer gridlines, same extent<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; padding:13px 16px; background:#FFFFFF\"><span style=\"flex:0 0 20px; font-size:11px; font-weight:700; color:#E58A2A\">2<\u002Fspan><span style=\"font-size:13px; color:#35342F\">Axis titles drop<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; padding:13px 16px; background:#FFFFFF\"><span style=\"flex:0 0 20px; font-size:11px; font-weight:700; color:#E58A2A\">3<\u002Fspan><span style=\"font-size:13px; color:#35342F\">Legend reflows <em>within<\u002Fem> the author's placement — side columns narrow and ellipsise, top/bottom bands wrap. Placement is never silently reassigned<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; padding:13px 16px; background:#FFFFFF\"><span style=\"flex:0 0 20px; font-size:11px; font-weight:700; color:#E58A2A\">4<\u002Fspan><span style=\"font-size:13px; color:#35342F\">Legend drops entirely — colour meaning moves to the tooltip<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; padding:13px 16px; background:#FFFFFF\"><span style=\"flex:0 0 20px; font-size:11px; font-weight:700; color:#E58A2A\">5<\u002Fspan><span style=\"font-size:13px; color:#35342F\">Title truncates to its ellipsis, then hides — the lane goes with it and the strip overlays the plot corner (§03)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:14px; align-items:center; padding:13px 16px; background:#F8F7F4\"><span style=\"flex:0 0 20px; font-size:11px; font-weight:700; color:#C84C4C\">✕<\u002Fspan><span style=\"font-size:13px; color:#7F2E2E\">Below the minimum viable card: plot only — the kebab goes too, and right-click becomes the only route (see the rule below)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:11px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">When the toolbar itself degrades — height first, kebab last<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">rule<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The existing machinery only knows width. <code style=\"font-size:11px; color:#B54B6E\">allowedActionsNum()<\u002Fcode> is <code style=\"font-size:11px; color:#B54B6E\">floor(objectFormat.width / actionWidth)<\u002Fcode>, where <code style=\"font-size:11px; color:#B54B6E\">MiniToolbarService.getActionsWidth<\u002Fcode> derives <code style=\"font-size:11px; color:#B54B6E\">actionWidth<\u002Fcode> from the root font size — 18px glyph + 4px icon padding + 1rem button padding + 2px border, so <strong>40px at a 16px root<\u002Fstrong>. Height is never consulted, so a 400×24 chart passes the width test and still cannot host a 30px strip.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:1px; border:1px solid #E8E5DE; border-radius:4px; overflow:hidden; background:#E8E5DE\">\n          <div style=\"display:grid; grid-template-columns:120px 1fr; gap:12px; padding:9px 12px; background:#F1EFEA; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#99958C\"><span>Card height<\u002Fspan><span>Toolbar — title visible, in the lane<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:120px 1fr; gap:12px; padding:10px 12px; background:#FFFFFF; font-size:12.5px; color:#35342F\"><span style=\"font-family:ui-monospace, monospace; color:#6A685F\">≥ 96px<\u002Fspan><span>Comfortable — 30px targets, up to three actions plus the kebab<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:120px 1fr; gap:12px; padding:10px 12px; background:#FFFFFF; font-size:12.5px; color:#35342F\"><span style=\"font-family:ui-monospace, monospace; color:#6A685F\">56 – 96px<\u002Fspan><span>Drops to the small step — 24px targets, 12px glyphs, same three plus the kebab<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:120px 1fr; gap:12px; padding:10px 12px; background:#FFFFFF; font-size:12.5px; color:#35342F\"><span style=\"font-family:ui-monospace, monospace; color:#6A685F\">32 – 56px<\u002Fspan><span><strong>Kebab only<\u002Fstrong> at 24px — the three actions drop, every action stays reachable through the menu<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:120px 1fr; gap:12px; padding:10px 12px; background:#F8F7F4; font-size:12.5px; color:#7F2E2E\"><span style=\"font-family:ui-monospace, monospace\">&lt; 32px<\u002Fspan><span>No chrome. A 24px control with 4px clearance does not fit; right-click is the only route<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>The title-hidden card has one size, not a ladder.<\u002Fstrong> The table above is the <em>in-lane<\u002Fem> strip. When the title is hidden the strip is overlaid, and §03 fixes it at the 24px small step at every height — it is small because it sits over the plot, not because the card is short, so it never occupies the comfortable row. Read the table for it this way: <strong>the top two rows collapse into one<\u002Fstrong> — at any height above 56px the overlaid strip is three 24px actions plus the kebab — while <strong>the bottom two rows govern it unchanged<\u002Fstrong>: 32–56px is kebab only, and below 32px there is no chrome. A 40px card cannot host three actions whether they sit in a lane or over the plot. So a 200px title-hidden card is 24px and a 200px card <em>with<\u002Fem> a title is 30px — same height, different strip, because they are in different places. The 44px touch floor is not one of these rows; it overrides all of them, as set out below.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>Two rules, and the second is the point.<\u002Fstrong> Width caps the action count at <code style=\"font-size:11px; color:#B54B6E\">Math.min(3, allowedActionsNum())<\u002Fcode> — a ceiling on machinery that already exists, not new machinery. Height decides the row above. And in both directions <strong>the kebab is the last thing to go<\u002Fstrong>: actions drop one at a time, the kebab survives them all, and only the final row removes it. That ordering is what keeps §02's resting affordance meaningful at every size a card can reach.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>Touch has no ladder — it has one row.<\u002Fstrong> The action buttons are inside <code style=\"font-size:11px; color:#B54B6E\">@if (!mobileDevice)<\u002Fcode> and this spec leaves them there, so on touch the kebab is the whole strip regardless of height (§02). It takes the 44px hit-target floor rather than any height band: <strong>at 52px and above<\u002Fstrong> (44 + 4 + 4) the kebab renders, <strong>below 52px<\u002Fstrong> there is no chrome. A 70px card is three 24px actions plus a kebab on a pointer device and a single 44px kebab on touch. Never satisfy a height band by shrinking a touch target below 44px — drop the control instead.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>Every rung shows the same list — §02's rule, restated because the ladder depends on it.<\u002Fstrong> The kebab is <em>not<\u002Fem> an overflow control that empties as the strip grows: per §02, overflowed toolbar actions are prepended to the menu groups <em>for both entry points<\u002Fem>, so the kebab and right-click always present one identical, complete list. That is what makes the lower rungs safe. At kebab-only nothing has been lost, only the shortcuts; at no-chrome the same list is one right-click away. It also means the kebab is never empty on an assembly with three or fewer actions — which matters less on a chart than on the 150px selection lists this pattern rolls out to, where an overflow-only kebab would vanish exactly where the resting glyph is the only affordance. On touch the action buttons never render at all, so this list <em>is<\u002Fem> the interface.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F7DEDE\"><strong>Fix the menu gap before relying on this ladder.<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">show-data<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">open-max-mode<\u002Fcode> / <code style=\"font-size:11px; color:#B54B6E\">close-max-mode<\u002Fcode> are toolbar-only today — <code style=\"font-size:11px; color:#B54B6E\">createMenuActions<\u002Fcode> does not carry them, so right-click cannot reach them at all. That is a standing bug, independent of this spec. §02's concatenation happens to paper over it: once suppressed, those actions overflow, and overflow is prepended to both entry points, so they stay reachable. <strong>Do not lean on that.<\u002Fstrong> It makes the one action whose purpose is rescuing a chart too small to read reachable only as a side effect of overflow arithmetic — and it breaks the moment anything stops building the toolbar array for a suppressed assembly. Add them to <code style=\"font-size:11px; color:#B54B6E\">createMenuActions<\u002Fcode> so the guarantee holds structurally. Not a blocker for §02, which ships on its own.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\"><strong>Where the numbers come from — one is derived, two are judgement.<\u002Fstrong> Only <strong>32px<\u002Fstrong> follows from anything: a 24px control needs 4px of clearance above and below, so below 32px no control fits and the question answers itself. <strong>56px<\u002Fstrong> (32 + 24) and <strong>96px<\u002Fstrong> (3 × 32) are expressed as steps off that floor so they at least move with the control tokens, but nothing computes them — they are the heights at which a strip stops feeling like it owns the card, and they are the part of this rule most likely to be wrong. Validate against real dashboards before implementing: a 56px card is common in a KPI row.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">07<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Token map — every name this spec uses<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Both tables below are the complete list — colour first, then the non-colour scales §02, §03, §04 and §06 cite. On <code style=\"font-size:12px; color:#B54B6E\">epic-74519<\u002Fcode> every colour name but one already ships <em>at the value drawn here<\u002Fem>: the shell palette settled on the same warm grey family this spec had been drawing independently, so there is nothing left to reconcile. The gridline grey is the single exception. Status reports only whether a token has to be added — not whether the rendered colour changes, because none does. Chrome only: the series palette is out of scope and specified elsewhere — the swatch colours in this document's mocks are illustrative and carry no recommendation.<\u002Fp>\n      <div style=\"border:1px solid #D9D5CC; border-radius:6px; overflow:hidden; background:#FFFFFF\">\n        <div style=\"display:grid; grid-template-columns:1.5fr 1fr 1.5fr 0.9fr; font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:#99958C; background:#F1EFEA; padding:10px 16px\">\n          <div>Role<\u002Fdiv><div>Rendered today<\u002Fdiv><div>Token — ships unless marked<\u002Fdiv><div>Status<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ tokens }}\" as=\"t\" hint-placeholder-count=\"7\">\n          <div style=\"display:grid; grid-template-columns:1.5fr 1fr 1.5fr 0.9fr; align-items:center; padding:11px 16px; border-top:1px solid #E8E5DE; font-size:12.5px\">\n            <div style=\"color:#35342F; font-weight:500\">{{ t.role }}<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; color:#6A685F; font-family:ui-monospace, monospace; font-size:11.5px\"><span style=\"flex:0 0 12px; height:12px; border-radius:2px; border:1px solid rgba(0,0,0,0.12); background:{{ t.swatch }}\"><\u002Fspan>{{ t.hex }}<\u002Fdiv>\n            <div style=\"color:#6A685F; font-family:ui-monospace, monospace; font-size:11.5px\">{{ t.token }}<\u002Fdiv>\n            <div><span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:{{ t.bg }}; color:{{ t.fg }}\">{{ t.status }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C; padding-top:4px\">Non-colour scales — 10 of 14 ship on epic-74519; 3 to add, 1 stays a literal (§04)<\u002Fdiv>\n      <div style=\"border:1px solid #D9D5CC; border-radius:6px; overflow:hidden; background:#FFFFFF\">\n        <div style=\"display:grid; grid-template-columns:1.5fr 1fr 1.5fr 0.9fr; font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase; color:#99958C; background:#F1EFEA; padding:10px 16px\">\n          <div>Role<\u002Fdiv><div>Value<\u002Fdiv><div>Token — ships unless marked TO ADD<\u002Fdiv><div>Cited by<\u002Fdiv>\n        <\u002Fdiv>\n
