  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:10px; font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:#99958C\">\n        <span style=\"width:18px; height:2px; background:#E58A2A\"><\u002Fspan>\n        <span>Chart alignment · spec<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0; font-size:38px; font-weight:600; letter-spacing:-0.6px; line-height:1.12; color:#1F1F1B; text-wrap:pretty\">The chart card, as chart-owned geometry<\u002Fh1>\n      <p style=\"margin:0; max-width:62ch; font-size:15px; line-height:1.6; color:#6A685F; text-wrap:pretty\">The chart emits title band, legend, border and plot as one object, so the card is chart-owned geometry rather than host chrome — this spec covers all of it. Sizing is expressed as rules first — which boxes flex and which size to their content — because authors resize charts and toggle elements per chart. §04 states the default-density values those rules resolve to.<\u002Fp>\n    <\u002Fheader>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">01<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Anatomy<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Four lanes, top to bottom. Chrome is intrinsic — each region sizes to its own content, and the title lane takes the greater of its type box and the toolbar strip. The plot is the remainder. Nothing in the card is positioned from an absolute coordinate.<\u002Fp>\n\n      <div style=\"display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap\">\n\n        <div style=\"flex:0 0 auto; position:relative; width:472px; border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04); overflow:hidden \"129\" y=\"109\" width=\"22\" height=\"91\" fill=\"{{ s1 }}\"><\u002Frect>\n                <rect x=\"129\" y=\"41\" width=\"22\" height=\"68\" fill=\"{{ s2 }}\"><\u002Frect>\n                <rect x=\"165\" y=\"157\" width=\"22\" height=\"43\" fill=\"{{ s1 }}\"><\u002Frect>\n                <rect x=\"165\" y=\"133\" width=\"22\" height=\"24\" fill=\"{{ s2 }}\"><\u002Frect>\n                <rect x=\"202\" y=\"111\" width=\"22\" height=\"89\" fill=\"{{ s1 }}\"><\u002Frect>\n                <rect x=\"202\" y=\"39\" width=\"22\" height=\"72\" fill=\"{{ s2 }}\"><\u002Frect>\n                <rect x=\"238\" y=\"144\" width=\"22\" height=\"56\" fill=\"{{ s1 }}\"><\u002Frect>\n                <rect x=\"238\" y=\"104\" width=\"22\" height=\"40\" fill=\"{{ s2 }}\"><\u002Frect>\n                <rect x=\"275\" y=\"127\" width=\"22\" height=\"73\" fill=\"{{ s1 }}\"><\u002Frect>\n                <rect x=\"275\" y=\"77\" width=\"22\" height=\"50\" fill=\"{{ s2 }}\"><\u002Frect>\n              <\u002Fg>\n              <g fill=\"#6A685F\" font-size=\"8\" text-anchor=\"middle\">\n                <text x=\"67\" y=\"212\">Business<\u002Ftext>\n                <text x=\"103\" y=\"212\">Educ.<\u002Ftext>\n                <text x=\"140\" y=\"212\">Games<\u002Ftext>\n                <text x=\"176\" y=\"212\">Graph.<\u002Ftext>\n                <text x=\"213\" y=\"212\">Hardw.<\u002Ftext>\n                <text x=\"249\" y=\"212\">Office<\u002Ftext>\n                <text x=\"286\" y=\"212\">Pers.<\u002Ftext>\n              <\u002Fg>\n              <text x=\"172\" y=\"228\" fill=\"#99958C\" font-size=\"9\" text-anchor=\"middle\">Category<\u002Ftext>\n              <text x=\"-2\" y=\"105\" fill=\"#6A685F\" font-size=\"9\" text-anchor=\"middle\" transform=\"rotate(-90 -2 105)\">Sum(Quantity Purchased)<\u002Ftext>\n\n              <g>\n                <text x=\"324\" y=\"14\" fill=\"#99958C\" font-size=\"9\" font-weight=\"600\" letter-spacing=\"0.4\">REGION<\u002Ftext>\n                <line x1=\"324\" y1=\"22\" x2=\"424\" y2=\"22\" stroke=\"#D9D5CC\" stroke-width=\"1\"><\u002Fline>\n                <rect x=\"324\" y=\"32\" width=\"9\" height=\"9\" rx=\"1.5\" fill=\"{{ s2 }}\"><\u002Frect>\n                <text x=\"339\" y=\"40\" fill=\"#35342F\" font-size=\"10\">USA West<\u002Ftext>\n                <rect x=\"324\" y=\"50\" width=\"9\" height=\"9\" rx=\"1.5\" fill=\"{{ s1 }}\"><\u002Frect>\n                <text x=\"339\" y=\"58\" fill=\"#35342F\" font-size=\"10\">USA East<\u002Ftext>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 300px; min-width:260px; display:flex; flex-direction:column; gap:14px\">\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 22px; height:22px; border-radius:3px; background:#F6E2C8; color:#7A4E10; font-size:10px; font-weight:700; display:grid; place-items:center\">A<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:3px\">\n              <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Title lane<\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Title left, anchored toolbar right — the target model, not what ships today (§02). Height is the greater of its type box and the toolbar strip, plus padding. Unfilled — a hairline rule only. Never a filled band.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 22px; height:22px; border-radius:3px; background:#F6E2C8; color:#7A4E10; font-size:10px; font-weight:700; display:grid; place-items:center\">B<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:3px\">\n              <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Plot<\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Takes all remaining space. Its top edge keeps half a line-height of clearance so the highest tick label never clips.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 22px; height:22px; border-radius:3px; background:#F6E2C8; color:#7A4E10; font-size:10px; font-weight:700; display:grid; place-items:center\">C<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:3px\">\n              <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Legend column<\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Rule-plus-list. Heading, 1px rule, swatch rows. No panel fill, no border. Width derives from the longest label, not a reserved corridor.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-start\">\n            <div style=\"flex:0 0 22px; height:22px; border-radius:3px; background:#F6E2C8; color:#7A4E10; font-size:10px; font-weight:700; display:grid; place-items:center\">D<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:3px\">\n              <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Card<\u002Fdiv>\n              <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">1px <code style=\"font-size:11px; color:#B54B6E\">--inet-default-border-color<\u002Fcode>, radius <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-xl<\u002Fcode> (6px), <code style=\"font-size:11px; color:#B54B6E\">--inet-shadow-low<\u002Fcode>.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">02<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Toolbar — from floating overlay to anchored strip<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">Two changes, and the second is the one that matters to users. Today <code style=\"font-size:12px; color:#B54B6E\">mini-toolbar.component<\u002Fcode> is an overlay: absolutely positioned at z-index 9920, hidden until hover, floating <em>above<\u002Fem> the assembly at <code style=\"font-size:12px; color:#B54B6E\">topY = top − 28 − adj<\u002Fcode>. It moves into the title lane instead — and <strong>the kebab stops hiding<\u002Fstrong>, so the card announces that it has controls before anyone touches it. <strong>Every visibility predicate is reused verbatim and no gating logic changes<\u002Fstrong> — what the strip shows in any given state is still decided by exactly the code that decides it today. The action <em>set<\u002Fem> does change, in the six scoped edits listed below.<\u002Fp>\n\n      <div style=\"display:flex; gap:20px; flex-wrap:wrap\">\n        <div style=\"flex:1 1 320px; min-width:300px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"display:flex; align-items:center; gap:9px\">\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">Before — floating overlay<\u002Fspan>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">ships today<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding-top:26px; position:relative\">\n            <div style=\"position:absolute; top:0; right:8px; display:flex; align-items:center; gap:1px; padding:2px 4px; border:1px solid #D9D5CC; border-radius:3px; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.10)\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"18\" height=\"18\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"18\" height=\"18\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"18\" height=\"18\" alt=\"Properties\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.76\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden; padding:12px 14px 14px; display:flex; flex-direction:column; gap:9px\">\n              <div style=\"font-size:11px; font-weight:600; line-height:1.2; color:#35342F\">Quantity purchased by category<\u002Fdiv>\n              <div style=\"height:96px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 15px, #F1EFEA 15px 16px)\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Sits outside the card, over whatever is above it. Its width is a runtime outcome of however many predicates happen to pass, so it grows and shrinks across the card's top edge.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 320px; min-width:300px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"display:flex; align-items:center; gap:9px\">\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">After — anchored in the title lane<\u002Fspan>\n            <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">this spec<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding-top:26px\">\n            <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden\">\n              <div style=\"position:relative; padding:12px 12px 8px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n                <div style=\"min-width:0; padding-right:123px; min-height:30px; display:flex; align-items:center; font-size:11px; font-weight:600; line-height:1.2; color:#35342F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">Quantity purchased by category<\u002Fdiv>\n                <div style=\"position:absolute; top:12px; right:12px; display:flex; align-items:center; gap:1px\">\n                  <div style=\"display:flex; align-items:center; gap:1px; opacity:{{ actionsOpacity }}; transition:opacity .15s\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"18\" height=\"18\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"18\" height=\"18\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"18\" height=\"18\" alt=\"Properties\" style=\"display:block; opacity:0.76\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"opacity:{{ kebabOpacity }}; transition:opacity .15s\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.76\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:10px 12px 14px\"><div style=\"height:96px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 15px, #F1EFEA 15px 16px)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Right-aligned in the lane, sharing it with the title. At most three buttons plus the kebab — a constant reserved width, so the title never shifts. The kebab is drawn at rest; the three actions fade in on hover or focus by opacity, never by <code style=\"font-size:11px; color:#B54B6E\">display<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px\">\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:11px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Cap at three, kebab takes the rest<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The strip shows the first three <em>currently visible<\u002Fem> actions, evaluated exactly as today. Everything past three is prepended to the menu — for both entry points, so the kebab and right-click always show an identical list. Fewer than three is fine — the strip is simply shorter; no button holds a reserved slot, so there is no disabled-versus-hidden question to answer.<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:5px; font-size:11.5px; font-family:ui-monospace, monospace; color:#6A685F\">\n            <span>1 · show-summary-icon<\u002Fspan>\n            <span>2 · expand-icon / contract-icon<\u002Fspan>\n            <span>3 · setting-icon → Properties…<\u002Fspan>\n            <span>trailing · menu-vertical-icon → everything else<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Targets <code style=\"font-size:11px; color:#B54B6E\">--inet-control-height-md<\u002Fcode> 30px, glyphs 18px — the glyph size is unnamed. On touch the action buttons do not render at all (see the touch bullet below), so the 44px step applies to the kebab, which is the only control there: the shipped <code style=\"font-size:11px; color:#B54B6E\">-lg<\u002Fcode> step stops at 36px, making it the one control value that is genuinely new. Everything else — the spacings, both radii, both shadows — already ships (§04). The strip already computes its own <code style=\"font-size:11px; color:#B54B6E\">topY<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">left<\u002Fcode> — anchoring deletes that math rather than adding any.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:11px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Reorder the group so \"first three\" means something<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">\"First three visible\" is only stable if the stable actions come first. Today's chart order is drill-down, drill-up, brush, clear-brush, zoom, clear-zoom, exclude-data, then <strong>show-data eighth<\u002Fstrong> — and the base class splices Hide MiniToolbar ahead of all of them at index 0 (see the suppression card below). With nothing selected the strip reads correctly; click a data point and Drill Down Filter, Brush and Zoom seize positions 1–3 and push the chart-level actions out. Icons would reshuffle under the pointer on every selection.<\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\">Emit the three stable actions first, contextual ones after. One array reordered in <code style=\"font-size:11px; color:#B54B6E\">createToolbarActions<\u002Fcode> — no predicate touched; it is the first of the six edits listed beside this card. Source order is arbitrary today: it is emission order in one array literal, and nothing reads position.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; padding:18px; display:flex; flex-direction:column; gap:11px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Six source edits — the complete list<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px; font-size:12.5px; line-height:1.55; color:#6A685F\">\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Reorder the toolbar array so the stable actions come first.<\u002Fstrong> One array literal in <code style=\"font-size:11px; color:#B54B6E\">createToolbarActions<\u002Fcode>, no predicate touched — the card beside this one explains why \"first three visible\" is meaningless without it.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Add a toolbar entry for Properties.<\u002Fstrong> It exists only as a menu action, and its declared <code style=\"font-size:11px; color:#B54B6E\">fa fa-slider<\u002Fcode> icon is never rendered — the menu draws labels only. Promoting it to slot 3 means adding a toolbar entry bound to <code style=\"font-size:11px; color:#B54B6E\">setting-icon<\u002Fcode>, reusing the menu entry handler and its predicate verbatim — all four conjuncts: <code style=\"font-size:11px; color:#B54B6E\">isActionVisibleInViewer(\"Properties\") &amp;&amp; !annotationsSelected &amp;&amp; !isPopComponent() &amp;&amp; !mobileDevice<\u002Fcode>. Do not paraphrase it; <code style=\"font-size:11px; color:#B54B6E\">!annotationsSelected<\u002Fcode> is what keeps Properties out of the strip while an annotation is selected.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Delete two toolbar entries.<\u002Fstrong> The kebab shows overflowed toolbar actions followed by the menu groups, so the two arrays are concatenated — and the toolbar entries <code style=\"font-size:11px; color:#B54B6E\">chart clear-brush<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">chart clear-zoom<\u002Fcode> (labelled Clear Brush, Clear Zoom) are the same two operations as the menu's own Clear Brushing and View All Data. On any brushed or zoomed chart, blind concatenation would list each twice under two names. Remove the toolbar pair and let the menu entries carry them; overflow is then a genuine blind append.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Mount the kebab on charts, outside the mobile guard.<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">mini-menu<\u002Fcode> appears only in <code style=\"font-size:11px; color:#B54B6E\">vs-selection<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">current-selection<\u002Fcode>; <code style=\"font-size:11px; color:#B54B6E\">mini-toolbar<\u002Fcode>'s template has no kebab. It is a new control here, not a relabel. <strong>Place it outside the <code style=\"font-size:11px; color:#B54B6E\">@if (!mobileDevice)<\u002Fcode> block<\u002Fstrong> that wraps the button container in <code style=\"font-size:11px; color:#B54B6E\">mini-toolbar.component.html<\u002Fcode> — inside it, touch devices keep exactly what they have now, which is no visible route to these actions at all.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #F6E2C8\"><strong style=\"color:#35342F\">Draw the kebab at rest.<\u002Fstrong> The three action buttons keep their hover and focus reveal; the kebab does not. Opacity only, and it holds its slot in both states so nothing reflows.<\u002Fdiv>\n            <div style=\"padding-left:11px; border-left:2px solid #C8B8E0\"><strong style=\"color:#35342F\">Move Hide MiniToolbar out of slot 0 — base class, all eight types.<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">AbstractVSActions.createToolbarActions<\u002Fcode> does <code style=\"font-size:11px; color:#B54B6E\">groups.splice(0, 0, …)<\u002Fcode> to prepend the <code style=\"font-size:11px; color:#B54B6E\">close-icon<\u002Fcode> dismissal ahead of every assembly action, so under a cap of three it consumes a slot before show-data is reached. It moves to the menu. <strong>This is the one edit outside the chart, and the only one in this spec with a blast radius:<\u002Fstrong> it lives in the shared base class and changes the strip for table, crosstab, calc table, calendar, both selection types, the container and the adhoc range slider at once. <strong>Decided: change the base class<\u002Fstrong> and update the other seven components as part of the rollout, rather than overriding <code style=\"font-size:11px; color:#B54B6E\">createToolbarActions<\u002Fcode> in the chart alone. The bug is in shared code, so shared code changes; a chart-only override would leave a divergence that quietly becomes permanent. Sequence it with the rollout so the seven other types get a reviewed strip rather than an incidental one.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Right-click keeps its behaviour and its cursor positioning: it selects the region under the cursor, then opens the list. One rule change comes with the cap — the overflowed toolbar actions are prepended for right-click too, not only for the kebab. Otherwise a plot selection could leave Brush, Zoom and Show Details reachable from the kebab but from nowhere in the right-click menu. The two entry points then differ only in position and in the fact that right-click can establish a selection, which a button in the title lane can never do.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #2E8B57; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:11px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">The kebab is always visible — the rest arrives on hover<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">decided<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">The resting kebab is a <strong>touch and keyboard affordance<\u002Fstrong>, not a mouse-discoverability fix. On a pointer device the strip is largely self-revealing — a viewer scanning a dashboard sweeps the pointer across cards and it appears — so little is claimed there. What has no hover to sweep is touch, where the action buttons do not render at all today, and the keyboard, where a control that exists only on hover has no resting focus target. Those two cases are the justification, and the strip gets a resting state for them. <strong>At rest the lane shows the kebab alone at <code style=\"font-size:11px; color:#B54B6E\">opacity: 0.55<\u002Fcode>. On hover or keyboard focus the three stable actions fade in beside it.<\u002Fstrong> The lane reserves the full strip width in both states, so nothing moves when they appear. \"Always\" has exactly two exceptions, both deliberate: a live Hide MiniToolbar dismissal (below), and a card too short to host any control at all — §06 removes the kebab below 32px, where right-click becomes the only route.<\u002Fdiv>\n        <div style=\"display:flex; gap:16px; flex-wrap:wrap\">\n          <div style=\"flex:1 1 210px; min-width:200px; display:flex; flex-direction:column; gap:7px\">\n            <span style=\"font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:#99958C\">At rest<\u002Fspan>\n            <div style=\"border:1px solid #D9D5CC; border-radius:3px; background:#FFFFFF; overflow:hidden\">\n              <div style=\"position:relative; padding:10px 10px 7px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n                <div style=\"min-width:0; padding-right:110px; min-height:30px; display:flex; align-items:center; font-size:10.5px; font-weight:600; line-height:1.2; color:#35342F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">Quantity by category<\u002Fdiv>\n                <div style=\"position:absolute; top:10px; right:10px; display:flex; align-items:center; gap:1px\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.55\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:9px 10px 11px\"><div style=\"height:52px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; line-height:1.5; color:#6A685F\">One dim glyph. A twenty-assembly dashboard gains twenty of these, not twenty toolbars.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 210px; min-width:200px; display:flex; flex-direction:column; gap:7px\">\n            <span style=\"font-size:10px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:#99958C\">Hover or focus<\u002Fspan>\n            <div style=\"border:1px solid #D9D5CC; border-radius:3px; background:#FFFFFF; overflow:hidden\">\n              <div style=\"position:relative; padding:10px 10px 7px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n                <div style=\"min-width:0; padding-right:110px; min-height:30px; display:flex; align-items:center; font-size:10.5px; font-weight:600; line-height:1.2; color:#35342F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">Quantity by category<\u002Fdiv>\n                <div style=\"position:absolute; top:10px; right:10px; display:flex; align-items:center; gap:1px\"><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"18\" height=\"18\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"18\" height=\"18\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"18\" height=\"18\" alt=\"Properties\" style=\"display:block; opacity:0.76\"><\u002Fdiv><div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.76\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:9px 10px 11px\"><div style=\"height:52px; border-radius:3px; background:repeating-linear-gradient(180deg, #FBFAF8 0 14px, #F1EFEA 14px 15px)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px; line-height:1.5; color:#6A685F\">Same three actions, same order, same predicates. Only the resting visibility changed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px; font-size:12px; line-height:1.55; color:#6A685F\">\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">It is the smallest permanent signal available.<\u002Fstrong> One glyph says \"this object has actions\" — the thing hover-only chrome can never say. Everything else stays on demand.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">Touch has no hover to reveal anything.<\u002Fstrong> Hover does not exist there, so a touch user's entire route to chart actions is a long-press they must already know about — and it is worse than that: <code style=\"font-size:11px; color:#B54B6E\">mini-toolbar.component.html<\u002Fcode> wraps the whole button container in <code style=\"font-size:11px; color:#B54B6E\">@if (!mobileDevice)<\u002Fcode>, so on a touch device <strong>the strip is not rendered at all<\u002Fstrong>. There is currently no visible route to these actions on mobile. A persistent kebab is what makes that answerable, but only if it is mounted <em>outside<\u002Fem> that guard — inside it, mobile keeps exactly what it has now, which is nothing. <strong>This spec leaves the guard in place, so touch gets the kebab and nothing else, at 44px.<\u002Fstrong> That is a complete route rather than a reduced one — the kebab opens the full list, and menu rows are easier to hit accurately than a row of icon buttons. Widening it to render the three actions on touch is a larger change than the pilot needs; propose it separately if the kebab proves not enough.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">It creates a keyboard and screen-reader entry point<\u002Fstrong> where there is none. A hover-revealed strip is unreachable by keyboard; a persistent kebab is an ordinary focusable button.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">It adds no behaviour.<\u002Fstrong> The kebab already opens the same list as right-click. The only thing changing is whether it is drawn at rest.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Weigh this on the touch and keyboard cases rather than on mouse discoverability — if those were answered another way (a kebab on touch only, say), hover-only on pointer devices would become defensible and cheaper in ink. Two alternatives ruled out on the current framing. <strong>Showing all three actions at rest<\u002Fstrong> is real ink at dashboard scale and makes the cap-of-three load-bearing in a way it should not be. <strong>Persistent-on-selection<\u002Fstrong> is circular as a discoverability fix — it appears only after the click it was supposed to invite — and there is no assembly-selection state in the viewer to key it to, so it would work only for authors, who already know the actions.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #C84C4C; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:11px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Turning the toolbar off stays exactly as it is — and it outranks the resting kebab<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F7DEDE; color:#7F2E2E\">do not change<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Two independent suppression mechanisms exist today. <strong>This spec changes neither, and both win over everything in §02.<\u002Fstrong> A deployment that turns the toolbar off sees no strip, no kebab and no resting glyph — anchoring and the resting state describe what the strip looks like <em>when it is shown at all<\u002Fem>.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; font-size:12.5px; line-height:1.55; color:#6A685F\">\n          <div style=\"padding-left:11px; border-left:2px solid #F0CFCF\"><strong style=\"color:#35342F\">Per-action visibility.<\u002Fstrong> Every predicate in the document is guarded by <code style=\"font-size:11px; color:#B54B6E\">isActionVisible(name)<\u002Fcode>, which tests the server-supplied <code style=\"font-size:11px; color:#B54B6E\">model.actionNames<\u002Fcode> deny-list — the hook through which actions are turned on and off outside the client. Hiding <em>every<\u002Fem> toolbar action this way empties the strip. The cap of three is applied to whatever survives these predicates, never to the declared set, so suppression composes with it correctly and needs no special case.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #F0CFCF\"><strong style=\"color:#35342F\">Per-assembly dismissal at runtime — and it is transient.<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">createToolbarActions<\u002Fcode> prepends a <code style=\"font-size:11px; color:#B54B6E\">close-icon<\u002Fcode> \"Hide MiniToolbar\" action calling <code style=\"font-size:11px; color:#B54B6E\">miniToolbarService.hideMiniToolbar(absoluteName)<\u002Fcode>. The service holds <strong>one<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">hideMiniToolbarAssembly<\u002Fcode> string, not a set, and <code style=\"font-size:11px; color:#B54B6E\">handleMouseEnter<\u002Fcode> clears it once the pointer leaves and returns. So this is a get-out-of-my-way for the current hover, <em>not<\u002Fem> a stored preference — dismiss it, move away, come back, and the strip is there again. It is gated by <code style=\"font-size:11px; color:#B54B6E\">isActionVisible(\"Hide MiniToolbar\")<\u002Fcode>, so a deployment can remove it entirely.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>The resting kebab must honour the dismissal while it lasts.<\u002Fstrong> A persistent glyph that survived \"Hide MiniToolbar\" would make the action useless, so dismissing hides the whole strip including the kebab, with right-click as the route back. But note what the transience means: <strong>this is not the opt-out for anyone who dislikes permanent chrome<\u002Fstrong> — it returns on the next hover. If the resting kebab draws that complaint, the answer is the per-action deny-list above, or a new preference; not this control.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\"><strong>Why keep it at all, once the strip cannot cover a neighbour?<\u002Fstrong> The dismissal almost certainly exists because a floating toolbar overlaps whatever sits above the assembly, and anchoring removes that reason entirely. But §02 replaces it with a different one: a hover-only strip costs nothing at rest, whereas <strong>a persistent kebab is permanent ink on every assembly<\u002Fstrong> — which is precisely what some users will want gone. Dismissal becomes the opt-out for the resting glyph rather than for the collision. Removing it in the same release that makes chrome permanent would withdraw the escape hatch exactly when it starts to matter. It also still earns its place in the title-hidden state, where the strip does overlay the plot's top-right corner.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\"><strong>One consequence for the cap<\u002Fstrong>, listed as the sixth source edit above: the close action is spliced in at <em>index 0<\u002Fem>, ahead of everything §02 reorders, so a naive \"first three visible\" spends a slot on it. It belongs in the menu, alongside the other things done <em>to<\u002Fem> the strip rather than to the chart. Worth confirming against a running build how it renders in the floating strip today, since it is the one toolbar entry that is not an assembly action.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">The nav bar stays floating — it is a viewport control, not an assembly control<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#E2F3E8; color:#1D5B39\">decided<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Anchoring the toolbar leaves one floating control behind. <code style=\"font-size:11px; color:#B54B6E\">chart-nav-bar<\u002Fcode> — the pan and zoom cluster — sits at <code style=\"font-size:11px; color:#B54B6E\">position:absolute; z-index:9999; left:15px; bottom:15px<\u002Fcode> and is revealed by the same hover gesture (<code style=\"font-size:11px; color:#B54B6E\">.chart-container:not(:hover) chart-nav-bar<\u002Fcode> hides it). Read on <code style=\"font-size:11px; color:#B54B6E\">epic-74519<\u002Fcode> at <code style=\"font-size:11px; color:#B54B6E\">graph/objects/chart-nav-bar.component.*<\u002Fcode>: four buttons — Clear (<code style=\"font-size:11px; color:#B54B6E\">home-icon<\u002Fcode>), Zoom In, Zoom Out, Pan — stacked vertically with a 1px <code style=\"font-size:11px; color:#B54B6E\">--inet-default-border-color<\u002Fcode> border, 5px radius, <code style=\"font-size:11px; color:#B54B6E\">--inet-toolbar-bg-color<\u002Fcode> fill and 15px glyphs. It carries no shadow despite sitting above the plot.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#E2F3E8\"><strong>Decided: it stays floating, and it is not folded into the strip.<\u002Fstrong> Pan and zoom act on <em>what you are looking at<\u002Fem>; the toolbar acts on <em>the assembly<\u002Fem>. That distinction is worth preserving in the layout — the Google Maps convention puts viewport controls over the map, not in a titlebar, and nobody looks for zoom in a title lane. What it gets is <code style=\"font-size:11px; color:#B54B6E\">--inet-shadow-low<\u002Fcode> on its own surface, so it reads as deliberately floating rather than as a strip anchoring forgot.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:9px; font-size:12.5px; line-height:1.55; color:#6A685F\">\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">Move it to the lower <em>right<\u002Fem>.<\u002Fstrong> It is at <code style=\"font-size:11px; color:#B54B6E\">left:15px; bottom:15px<\u002Fcode> today — lower left. Moving it right puts it diagonally opposite the toolbar, so the two clusters can never read as one control, and clears the top-left region where map labels and legends usually sit.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">Inset from the plot area, not the card.<\u002Fstrong> The one real collision risk: a bottom-placed legend (§05) and the x-axis lane both occupy the card's lower edge. Anchor the nav bar to the plot's bottom-right corner so it floats over the plot and clears both, rather than overlapping whichever happens to be there.<\u002Fdiv>\n          <div style=\"padding-left:11px; border-left:2px solid #CFE4D6\"><strong style=\"color:#35342F\">Two token bindings while it is being touched.<\u002Fstrong> The 5px radius is off-scale — use <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-lg<\u002Fcode> (4px) or <code style=\"font-size:11px; color:#B54B6E\">--inet-radius-xl<\u002Fcode> (6px). And <code style=\"font-size:11px; color:#B54B6E\">z-index:9999<\u002Fcode> is a magic number that will outrank real overlays; it needs a considered value, not the maximum.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\"><strong>Confirmed map-only.<\u002Fstrong> <code style=\"font-size:11px; color:#B54B6E\">chart-area.component.html<\u002Fcode> renders the nav bar inside <code style=\"font-size:11px; color:#B54B6E\">@if (isNavMap())<\u002Fcode>, so it appears on map charts and nowhere else — the reach of this change is one chart type, not all of them. <strong>One implementation note:<\u002Fstrong> it is a sibling of <code style=\"font-size:11px; color:#B54B6E\">.chart-area__background<\u002Fcode> inside <code style=\"font-size:11px; color:#B54B6E\">.chart-container<\u002Fcode>, so its <code style=\"font-size:11px; color:#B54B6E\">left/bottom<\u002Fcode> resolve against the container, not the plot. Anchoring it to the plot's bottom-right corner as specified above means positioning against <code style=\"font-size:11px; color:#B54B6E\">plotRegion<\u002Fcode>, which lives one level deeper in <code style=\"font-size:11px; color:#B54B6E\">.chart-content<\u002Fcode> — not simply flipping <code style=\"font-size:11px; color:#B54B6E\">left:15px<\u002Fcode> to <code style=\"font-size:11px; color:#B54B6E\">right:15px<\u002Fcode>. Neighbouring overlay literals are tracked in <code style=\"font-size:11px; color:#B54B6E\">Chart overlay surfaces - ticket.md<\u002Fcode>: the axis resize handles use CSS named <code style=\"font-size:11px; color:#B54B6E\">gray<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">white<\u002Fcode>, and the drill and date-comparison chips add two more floating indicators at <code style=\"font-size:11px; color:#B54B6E\">z-index: 5000<\u002Fcode>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:11px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Three controls say \"zoom\" and mean different things — all three reach viewers<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#F8E8CC; color:#7A4E10\">naming<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Verified in <code style=\"font-size:11px; color:#B54B6E\">chart-actions.ts<\u002Fcode>. This is not a layout problem, but it will make the anchored strip read as confused if left alone: a viewer meets all three, and nothing in the icons or labels separates viewport from data.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:1px; border:1px solid #E8E5DE; border-radius:4px; overflow:hidden; background:#E8E5DE\">\n          <div style=\"display:grid; grid-template-columns:1.1fr 0.8fr 1.5fr; gap:12px; padding:9px 12px; background:#F1EFEA; font-size:9.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:#99958C\"><span>Control<\u002Fspan><span>Where<\u002Fspan><span>What it actually does<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1.1fr 0.8fr 1.5fr; gap:12px; padding:10px 12px; background:#FFFFFF; font-size:12.5px; color:#35342F\"><span>Zoom In / Zoom Out<\u002Fspan><span style=\"color:#6A685F\">nav bar, floating<\u002Fspan><span><strong>Viewport<\u002Fstrong> — magnifies what you are looking at<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1.1fr 0.8fr 1.5fr; gap:12px; padding:10px 12px; background:#FFFFFF; font-size:12.5px; color:#35342F\"><span>Zoom Chart <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:#99958C\">zoom-in-icon<\u002Fspan><\u002Fspan><span style=\"color:#6A685F\">toolbar<\u002Fspan><span><strong>Data scope<\u002Fstrong> — zooms to the selected points, gated by <code style=\"font-size:11px; color:#B54B6E\">brushable<\u002Fcode>, sibling of Brush and Exclude Data<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1.1fr 0.8fr 1.5fr; gap:12px; padding:10px 12px; background:#FFFFFF; font-size:12.5px; color:#35342F\"><span>Resize Plot<\u002Fspan><span style=\"color:#6A685F\">menu only<\u002Fspan><span><strong>Plot geometry<\u002Fstrong> — not a toolbar action; gated by <code style=\"font-size:11px; color:#B54B6E\">plotResizable<\u002Fcode><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>Recommendation: rename Zoom Chart.<\u002Fstrong> It carries <code style=\"font-size:11px; color:#B54B6E\">zoom-in-icon<\u002Fcode> — the same magnifier metaphor as the nav bar's viewport control — while doing something entirely different. Something like <em>Zoom to Selection<\u002Fem> names the data scope and stops the collision. Its own clear action already models this: the toolbar labels it \"Clear Zoom\" but the menu labels the identical <code style=\"font-size:11px; color:#B54B6E\">chart clear-zoom<\u002Fcode> id <strong>\"View All Data\"<\u002Fstrong>, which is the clearer of the two. Pick one and use it in both places.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">Two corrections this read produced. <strong>Resize Plot is menu-only<\u002Fstrong>, not a toolbar action as earlier notes implied — so it never competes for one of the three slots. And <strong>Properties is menu-only too<\u002Fstrong> (<code style=\"font-size:11px; color:#B54B6E\">chart properties<\u002Fcode> in <code style=\"font-size:11px; color:#B54B6E\">createMenuActions<\u002Fcode>), which confirms §02's second source edit is genuinely additive: the toolbar has <code style=\"font-size:11px; color:#B54B6E\">chart edit<\u002Fcode>, not Properties. Item 8's precondition also verified — <code style=\"font-size:11px; color:#B54B6E\">show-data<\u002Fcode>, <code style=\"font-size:11px; color:#B54B6E\">open-max-mode<\u002Fcode> and <code style=\"font-size:11px; color:#B54B6E\">close-max-mode<\u002Fcode> appear only in <code style=\"font-size:11px; color:#B54B6E\">createToolbarActions<\u002Fcode>.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D9D5CC; border-left:3px solid #7455A8; border-radius:6px; background:#FFFFFF; padding:16px 18px; display:flex; flex-direction:column; gap:10px\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-size:13px; font-weight:600; color:#1F1F1B\">Generalizing beyond charts — the card is the pilot<\u002Fdiv>\n          <span style=\"font-size:10px; font-weight:600; letter-spacing:0.3px; padding:3px 7px; border-radius:3px; background:#EDE8F5; color:#3D2070\">separate document<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#6A685F\">Seven other assemblies float a toolbar today. <code style=\"font-size:11px; color:#B54B6E\">hasMiniToolbar()<\u002Fcode> lists table, crosstab, calc table, calendar, selection list, selection tree and selection container, plus the range slider when it is an adhoc filter — and <strong>no small input widget at all<\u002Fstrong>: spinner, slider, combo box, checkbox and the rest never receive one, before or after this change. Every type on that list except the range slider already declares <code style=\"font-size:11px; color:#B54B6E\">titleVisible<\u002Fcode>, so anchoring needs no new structure anywhere.<\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.6; color:#35342F; padding:11px 13px; border-radius:4px; background:#F8F7F4\"><strong>The one decision with app-wide consequences is settled: a title-hidden assembly reserves nothing.<\u002Fstrong> Had it reserved a condensed lane, every title-hidden table and selection list in every existing dashboard would gain ~30px of chrome and lose that much content — a pixel-positioned break across a customer's whole portfolio. Overlaying the strip inside the card's top-right costs no layout and still buys everything anchoring is for: it moves with the assembly, stays inside the border, and is no longer clamped against viewport bounds. §03 specifies it for the chart, and that is the answer for all eight.<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.55; color:#99958C; border-top:1px solid #E8E5DE; padding-top:9px\">The rest is recorded in <code style=\"font-size:11px; color:#B54B6E\">Anchoring beyond charts - discussion.md<\u002Fcode>: that three is a <em>ceiling<\u002Fem> rather than a target once a 150px selection list is in scope (<code style=\"font-size:11px; color:#B54B6E\">Math.min(3, allowedActionsNum())<\u002Fcode>); that selection containers already suppress child toolbars and the anchored design must inherit that rather than rediscover it; and that <code style=\"font-size:11px; color:#B54B6E\">VSRangeSliderModel<\u002Fcode> has no <code style=\"font-size:11px; color:#B54B6E\">titleVisible<\u002Fcode> at all — its title takes a <code style=\"font-size:11px; color:#B54B6E\">titleRatio<\u002Fcode> of the width beside the slider, so it has no lane to anchor into and should stay outside the pattern.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:14px; padding:16px 18px; border:1px solid #D9D5CC; border-left:3px solid #E58A2A; border-radius:6px; background:#FFFFFF\">\n        <div style=\"font-size:13px; line-height:1.6; color:#35342F\">Deliberately <em>not<\u002Fem> in scope: which actions deserve to be toolbar actions, how selection gating should work, and whether the menu's grouping is right. Those are all live questions, but they are separable from moving the strip — and answering them here is what turned earlier drafts of this section into a re-specification of the action model.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:20px\">\n      <div style=\"display:flex; align-items:baseline; gap:12px\">\n        <span style=\"font-size:11px; font-weight:700; color:#E58A2A; letter-spacing:0.5px\">03<\u002Fspan>\n        <h2 style=\"margin:0; font-size:21px; font-weight:600; color:#1F1F1B; letter-spacing:-0.2px\">Title hidden — overlay, never reserve<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0; max-width:70ch; font-size:14px; line-height:1.65; color:#6A685F\">The lane belongs to the title. Hide the title and <strong>the lane goes with it<\u002Fstrong>: the plot starts at the card's 12px inset, and the strip overlays the plot's top-right corner on its own small surface. Nothing is reserved, so hiding a title returns every pixel to the plot — and rolling this pattern out to the other seven assembly types cannot reflow a single existing dashboard. The topmost tick label still gets its clearance, but that is the plot's own internal padding, which it already has today.<\u002Fp>\n\n      <div style=\"display:flex; gap:20px; flex-wrap:wrap\">\n        <div style=\"flex:1 1 300px; min-width:280px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">Title visible<\u002Fdiv>\n          <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden\">\n            <div style=\"position:relative; padding:12px 12px 8px; border-bottom:1px solid rgba(217,213,204,0.72)\">\n              <div style=\"min-width:0; padding-right:123px; min-height:30px; display:flex; align-items:center; font-size:11px; font-weight:600; color:#35342F; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis\">Quantity purchased by category<\u002Fdiv>\n              <div style=\"position:absolute; top:12px; right:12px; display:flex; align-items:center; gap:1px\">\n                <div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center; background:rgba(0,0,0,0.045)\"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"18\" height=\"18\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"18\" height=\"18\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"18\" height=\"18\" alt=\"Properties\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <div style=\"width:30px; height:30px; border-radius:3px; display:grid; place-items:center\"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"18\" height=\"18\" alt=\"Actions\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:110px; padding:8px 12px 4px\">\n              <svg sc-camel-view-box=\"0 0 376 110\" width=\"100%\" height=\"100%\" style=\"display:block; font-family:Inter, Roboto, sans-serif\">\n                <g stroke=\"#E8E5DE\" stroke-width=\"1\">\n                  <line x1=\"38\" y1=\"10\" x2=\"368\" y2=\"10\"><\u002Fline>\n                  <line x1=\"38\" y1=\"32\" x2=\"368\" y2=\"32\"><\u002Fline>\n                  <line x1=\"38\" y1=\"54\" x2=\"368\" y2=\"54\"><\u002Fline>\n                  <line x1=\"38\" y1=\"76\" x2=\"368\" y2=\"76\"><\u002Fline>\n                <\u002Fg>\n                <line x1=\"38\" y1=\"98\" x2=\"368\" y2=\"98\" stroke=\"#D9D5CC\" stroke-width=\"1\"><\u002Fline>\n                <g fill=\"#6A685F\" font-size=\"8\" text-anchor=\"end\">\n                  <text x=\"32\" y=\"13\">10k<\u002Ftext>\n                  <text x=\"32\" y=\"57\">5k<\u002Ftext>\n                  <text x=\"32\" y=\"101\">0<\u002Ftext>\n                <\u002Fg>\n                <g>\n                  <rect x=\"46\" y=\"74\" width=\"24\" height=\"24\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"46\" y=\"56\" width=\"24\" height=\"18\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"92\" y=\"70\" width=\"24\" height=\"28\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"92\" y=\"50\" width=\"24\" height=\"20\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"138\" y=\"54\" width=\"24\" height=\"44\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"138\" y=\"22\" width=\"24\" height=\"32\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"184\" y=\"77\" width=\"24\" height=\"21\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"184\" y=\"65\" width=\"24\" height=\"12\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"230\" y=\"55\" width=\"24\" height=\"43\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"230\" y=\"21\" width=\"24\" height=\"34\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"276\" y=\"71\" width=\"24\" height=\"27\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"276\" y=\"52\" width=\"24\" height=\"19\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"322\" y=\"63\" width=\"24\" height=\"35\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"322\" y=\"39\" width=\"24\" height=\"24\" fill=\"{{ s2 }}\"><\u002Frect>\n                <\u002Fg>\n              <\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.55; color:#6A685F\">Lane sized by the strip at default type — the title takes over above ~24px. The strip's width is reserved permanently and the kebab is drawn at rest; the three actions arrive on hover or focus via opacity — never <code style=\"font-size:11px; color:#B54B6E\">display<\u002Fcode>, or the title jumps.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 300px; min-width:280px; display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:#99958C\">Title hidden<\u002Fdiv>\n          <div style=\"border:1px solid #D9D5CC; border-radius:6px; background:#FFFFFF; overflow:hidden\">\n            <div style=\"position:relative; height:151px; padding:12px 12px 4px\">\n              <div style=\"position:absolute; top:12px; right:12px; z-index:1; display:flex; align-items:center; gap:1px; padding:2px; border-radius:3px; background:rgba(255,255,255,0.94); box-shadow:0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04)\">\n                <div style=\"display:flex; align-items:center; gap:1px; opacity:{{ actionsOpacity }}; transition:opacity .15s\">\n                <div style=\"width:24px; height:24px; border-radius:3px; display:grid; place-items:center\"><img src=\"3592de85-c5c2-4e30-955d-3a7ccf9b67aa\" width=\"12\" height=\"12\" alt=\"Show Summary Data\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <div style=\"width:24px; height:24px; border-radius:3px; display:grid; place-items:center\"><img src=\"cf08a3fb-21b0-4ae0-8fe3-b8b8cb9bdefd\" width=\"12\" height=\"12\" alt=\"Show Enlarged\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <div style=\"width:24px; height:24px; border-radius:3px; display:grid; place-items:center\"><img src=\"113af776-acd5-42a5-8c16-eb7eb878da09\" width=\"12\" height=\"12\" alt=\"Properties\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"opacity:{{ kebabOpacity }}; transition:opacity .15s\">\n                <div style=\"width:24px; height:24px; border-radius:3px; display:grid; place-items:center\"><img src=\"939ae66d-8c01-42aa-9409-7936e15a33ff\" width=\"12\" height=\"12\" alt=\"Actions\" style=\"display:block; opacity:0.72\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:135px\">\n              <svg sc-camel-view-box=\"0 0 376 129\" width=\"100%\" height=\"100%\" style=\"display:block; font-family:Inter, Roboto, sans-serif\">\n                <g stroke=\"#E8E5DE\" stroke-width=\"1\">\n                  <line x1=\"38\" y1=\"12\" x2=\"368\" y2=\"12\"><\u002Fline>\n                  <line x1=\"38\" y1=\"38\" x2=\"368\" y2=\"38\"><\u002Fline>\n                  <line x1=\"38\" y1=\"64\" x2=\"368\" y2=\"64\"><\u002Fline>\n                  <line x1=\"38\" y1=\"90\" x2=\"368\" y2=\"90\"><\u002Fline>\n                <\u002Fg>\n                <line x1=\"38\" y1=\"116\" x2=\"368\" y2=\"116\" stroke=\"#D9D5CC\" stroke-width=\"1\"><\u002Fline>\n                <g fill=\"#6A685F\" font-size=\"8\" text-anchor=\"end\">\n                  <text x=\"32\" y=\"15\">10k<\u002Ftext>\n                  <text x=\"32\" y=\"67\">5k<\u002Ftext>\n                  <text x=\"32\" y=\"119\">0<\u002Ftext>\n                <\u002Fg>\n                <g>\n                  <rect x=\"46\" y=\"88\" width=\"24\" height=\"28\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"46\" y=\"67\" width=\"24\" height=\"21\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"92\" y=\"83\" width=\"24\" height=\"33\" fill=\"{{ s1 }}\"><\u002Frect>\n                  <rect x=\"92\" y=\"59\" width=\"24\" height=\"24\" fill=\"{{ s2 }}\"><\u002Frect>\n                  <rect x=\"138\" y=\"64\" width=\"24\" height=\"52\" fill=\"{{ s1 }}\"><\u002F
