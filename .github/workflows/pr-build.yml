name: Validation Build
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: gh-stylebi
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache NPM global cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Authenticate with GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      # the core tests run in the core-tests job, in parallel with this one. the tag matches
      # no test, so core runs none here (surefire.groups is read only by core)
      - name: Build with Maven
        run: ./mvnw --batch-mode clean install -Dsurefire.groups=ci-skip-core-tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The core tests, in parallel with the build job. Tests tagged slow are left to the daily
  # slow-tests.yml; the surefire.forkCount JVMs in core/pom.xml run the rest at once
  core-tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: gh-stylebi
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build core and its dependencies
        run: ./mvnw --batch-mode install -pl core -am -DskipTests -Dmaven.javadoc.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Core tests
        run: ./mvnw --batch-mode test -pl core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Production runs worksheet scripts on pooled contexts (script.ws.contextPool defaults to
  # true), but the lockcycle suite runs with the pool off unless -Dlockcycle.pool=true is
  # set. This job runs it in the production mode, slow-tagged classes included. It takes about
  # 5 minutes of test time.
  lockcycle-pool-on:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: gh-stylebi
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build core and its dependencies
        run: ./mvnw --batch-mode install -pl core -am -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lockcycle suite with the pool on
        run: >-
          ./mvnw --batch-mode test -pl core
          -Dtest='**/lockcycle/*Test'
          -Dlockcycle.pool=true
          '-Dsurefire.groups=core | slow'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
