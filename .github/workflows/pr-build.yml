name: Validation Build
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: gh-stylebi
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache local Maven repository
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache NPM global cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Authenticate with GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      # one job, so a PR uses one runner. -T 2 builds web, which does not depend on core,
      # while core runs its tests; tests tagged slow, and the lockcycle suite with the pool off,
      # are left to the daily slow-tests.yml
      #
      # A hosted runner that dies mid-build (Bug #81520: the job log and the Build step just stop,
      # and the job sits until the cap) leaves nothing in the log to say why. Every minute print
      # the load, memory, biggest processes and the age of the newest core surefire report (one
      # is written as each test class finishes). If these lines keep coming while the report age
      # grows, it is a hang, and the threads of the surefire forks are dumped (at most every 10
      # minutes) once no class has finished for 5 minutes, which is as long as one test may run
      # (surefire.testTimeout). If the lines stop too, the runner died. The forks are also dumped
      # at 40 minutes of step time, shortly before the fork timeout in core/pom.xml.
      - name: Build with Maven
        run: |
          dump_forks() {
            for pid in $(pgrep -f surefirebooter); do
              echo "[ci-monitor] thread dump of surefire fork $pid ($1)"
              jcmd "$pid" Thread.print || true
            done
          }
          (
            last_dump=0
            while sleep 60; do
              now=$(date +%s)
              newest=$(find core/target/surefire-reports -name '*.txt' -printf '%T@
' 2>/dev/null | sort -n | tail -1)
              age=-1
              if [ -n "$newest" ]; then age=$((now - ${newest%.*})); fi
              echo "[ci-monitor] $(date -u +%T) load=$(cut -d' ' -f1-3 /proc/loadavg) $(free -m | awk '/^Mem:/{print "used_mb="$3" avail_mb="$7}') last_report_age=${age}s top: $(ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<=5{printf "%s=%dMB ",$2,$1/1024}')"
              if [ "$age" -gt 300 ] && [ $((now - last_dump)) -gt 600 ]; then
                last_dump=$now
                dump_forks "no test class finished for ${age}s"
              fi
            done
          ) &
          monitor=$!
          (
            sleep 2400
            dump_forks "40 minutes into the build"
          ) &
          dumper=$!
          trap 'kill $monitor $dumper 2>/dev/null || true' EXIT
          ./mvnw --batch-mode -T 2 clean install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
